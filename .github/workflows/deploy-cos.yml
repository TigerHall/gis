name: Deploy to Tencent COS

on:
  push:
    branches:
      - main

jobs:
  sync-to-cos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install coscli
        run: |
          wget -q https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64 -O coscli
          chmod +x coscli
          sudo mv coscli /usr/local/bin/coscli

      - name: Configure coscli
        run: |
          cat > ~/.cos.yaml <<'EOF'
          cos:
            base:
              secretid: SECRET_ID_PLACEHOLDER
              secretkey: SECRET_KEY_PLACEHOLDER
              sessiontoken: ""
              mode: "SecretKey"
              cvmrolename: ""
              close_auto_switch_host: false
              disable_encryption: true
              disable_auto_fetch_bucket_type: false
            buckets:
              - alias: default
                bucket: BUCKET_PLACEHOLDER
                region: REGION_PLACEHOLDER
                endpoint: cos.REGION_PLACEHOLDER.myqcloud.com
                ofs: false
          EOF
          sed -i "s|SECRET_ID_PLACEHOLDER|${{ secrets.COS_SECRET_ID }}|" ~/.cos.yaml
          sed -i "s|SECRET_KEY_PLACEHOLDER|${{ secrets.COS_SECRET_KEY }}|" ~/.cos.yaml
          sed -i "s|BUCKET_PLACEHOLDER|${{ secrets.COS_BUCKET }}|" ~/.cos.yaml
          sed -i "s|REGION_PLACEHOLDER|${{ secrets.COS_REGION }}|g" ~/.cos.yaml

      - name: Sync to COS
        run: |
          coscli sync . cos://${{ secrets.COS_BUCKET }}/ \
            --exclude '\.git/.*' \
            --routines 10 \
            --delete
