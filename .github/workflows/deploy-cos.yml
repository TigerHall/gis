name: Deploy to Tencent COS

on:
  push:
    branches:
      - main

jobs:
  sync-to-cos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 安装腾讯云官方 coscli（比 coscmd 快 2~5 倍，支持并发）
      - name: Install coscli
        run: |
          wget -q https://github.com/tencentyun/coscli/releases/download/v1.0.8/coscli-v1.0.8-linux-amd64
          chmod +x coscli-linux-amd64
          sudo mv coscli-linux-amd64 /usr/local/bin/coscli

      # 配置密钥
      - name: Configure coscli
        run: |
          coscli config init -a ${{ secrets.COS_SECRET_ID }} \
                             -s ${{ secrets.COS_SECRET_KEY }} \
                             -b ${{ secrets.COS_BUCKET }} \
                             -r ${{ secrets.COS_REGION }}

      # 同步到 COS：并发10、增量上传、忽略 .git 目录
      - name: Sync to COS
        run: |
          coscli sync . cos://${{ secrets.COS_BUCKET }}/ \
            --exclude '.git/**' \
            --parallel 10
