name: Deploy to Tencent COS

on:
  push:
    branches:
      - main

jobs:
  sync-to-cos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install coscmd
        run: pip install coscmd

      - name: Configure coscmd
        run: coscmd config -a ${{ secrets.COS_SECRET_ID }} -s ${{ secrets.COS_SECRET_KEY }} -b ${{ secrets.COS_BUCKET }} -r ${{ secrets.COS_REGION }} --timeout 300

      - name: Sync to COS
        run: coscmd upload -rs . / --ignore './.git/*'
