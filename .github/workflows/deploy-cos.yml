name: Deploy to Tencent COS

on:
  push:
    branches:
      - main   # 只在推送到 main 分支时触发

jobs:
  sync-to-cos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload to Tencent COS
        uses: TencentCloud/cos-action@v1
        with:
          secret_id: ${{ secrets.COS_SECRET_ID }}
          secret_key: ${{ secrets.COS_SECRET_KEY }}
          cos_bucket: ${{ secrets.COS_BUCKET }}   # 格式：bucketname-appid，如 yugis-1234567890
          cos_region: ${{ secrets.COS_REGION }}   # 如 ap-guangzhou / ap-chengdu
          local_path: .                            # 同步整个仓库根目录
          remote_path: /                           # 上传到存储桶根目录
          # 删除 COS 上已在仓库中删除的文件（保持同步）
          accelerate: false                        # 如果开了 CDN 加速域名可改 true
          clean: false                             # 改为 true 则删除 COS 上多余文件（谨慎开启）
