name: Deploy to Tencent COS

on:
  push:
    branches:
      - main

jobs:
  sync-to-cos:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install coscmd
        run: pip install coscmd

      - name: Configure coscmd
        run: coscmd config -a ${{ secrets.COS_SECRET_ID }} -s ${{ secrets.COS_SECRET_KEY }} -b ${{ secrets.COS_BUCKET }} -r ${{ secrets.COS_REGION }}

      - name: Sync to COS (incremental)
        run: coscmd sync . /
        # sync: 只上传有变化的文件（比较大小 + MD5），跳过未变更的
