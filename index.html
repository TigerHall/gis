<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>海底地质一张图</title>
    <!-- Leaflet核心库 -->
    <script src="./assets/leaflet.js"></script>
    <link rel="stylesheet" href="./assets/leaflet.css" />
    <!-- 纯函数工具（无外部依赖） -->
    <script src="./assets/geo-utils.js"></script>
    <!-- Leaflet 插件：GeoMarker 图标工厂 -->
    <script src="./assets/Leaflet.GeoMarker.js"></script>
    <!-- Leaflet 插件：GZ 加载器 + IDB 缓存 -->
    <script src="./assets/Leaflet.GzIdbLoader.js"></script>
    <!-- 显示坐标插件 -->
    <link rel="stylesheet" href="./assets/Leaflet.MousePosition.css" />
    <script src="./assets/Leaflet.MousePosition.js"></script>
    <!-- GeoJSON Loader 样式 -->
    <link rel="stylesheet" href="./assets/geojsonloader.css" />
    <!-- Leaflet-Geoman 测量插件 -->
    <link rel="stylesheet" href="./assets/leaflet-geoman.css" />
    <script src="./assets/leaflet-geoman.js"></script>
    <!-- Leaflet点聚类插件（≤10K 点回退方案） -->
    <link rel="stylesheet" href="./assets/leaflet.markercluster.css" />
    <link rel="stylesheet" href="./assets/leaflet.markercluster.default.css" />
    <script src="./assets/leaflet.markercluster.js"></script>
    <!-- RBush 空间索引（Canvas 聚类依赖） -->
    <script src="./assets/rbush.js"></script>
    <!-- Canvas 聚类渲染（>10K 点零 DOM 方案） -->
    <script src="./assets/Leaflet.MarkersCanvas.js"></script>
    <!-- 格式转换库：shp/kml/kmz → GeoJSON（CDN，后续可本地化） -->
    <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script>
    <script src="https://unpkg.com/@mapbox/togeojson@0.16.2/togeojson.js"></script>
    <script src="https://unpkg.com/jszip@3/dist/jszip.min.js"></script>
    <!-- 自定义css -->
    <link rel="stylesheet" href="./assets/main.css" />

    <!-- WPA -->
    <link rel="manifest" href="./manifest.json" />
    <script>
      // 尽早捕获 PWA 安装提示事件（供 Leaflet.MousePosition 插件使用）
      window._pwaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        // 不拦截，让浏览器也可以自动弹窗；同时记录事件供自定义按钮使用
        window._pwaInstallPrompt = e;
      });

      // 检查浏览器是否支持Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("service-worker.js")
            .then((registration) => {
              // 检测新版本：SW 文件变化时会触发 updatefound
              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                newWorker.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    // 新 SW 已安装且旧 SW 仍在控制页面 → 有更新可用
                    window._swUpdateAvailable = true;
                    if (window._showUpdateToast) window._showUpdateToast();
                  }
                });
              });
            })
            .catch((error) => {
              console.error("Service Worker注册失败：", error);
            });
        });
      }
    </script>
    <!-- 适配iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="#99cc99" />
    <meta name="apple-mobile-web-app-title" content="YuGIS" />
    <!-- iOS 主屏幕图标（优先SVG，降级用PNG） -->
    <link
      rel="apple-touch-icon"
      href="./assets/images/icon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="./assets/images/icon/ios/152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="./assets/images/icon/ios/167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/images/icon/ios/180.png"
    />
    <!-- Windows 瓷砖配置 -->
    <meta name="msapplication-config" content="./browserconfig.xml" />
    <!-- 主题色适配 -->
    <meta name="theme-color" content="#99cc99" />
    <link rel="icon" href="./assets/images/icon.svg" type="image/svg+xml" />
  </head>
  <body>
    <!-- 悬浮触发按钮 -->
    <div class="layer-trigger" id="layerTrigger">要素加载</div>
    <!-- 左侧图层控制面板 -->
    <div class="layer-panel" id="layerPanel">
      <h3>图层要素</h3>
      <!-- 搜索框 -->
      <div class="search-bar" id="searchBar">
        <input
          type="text"
          id="searchInput"
          placeholder="🔍 搜索站位..."
          autocomplete="off"
        />
        <div class="search-results" id="searchResults"></div>
      </div>
      <!-- 聚类开关 -->
      <div
        class="cluster-toggle-bar"
        id="clusterToggleBar"
        title="关闭后所有点要素展开显示"
      >
        <label class="cluster-toggle-label">
          <span class="cluster-toggle-text">点要素聚类</span>
          <input type="checkbox" id="clusterToggle" checked />
          <span class="cluster-toggle-switch"></span>
        </label>
      </div>
      <!-- 标签开关 -->
      <div
        class="cluster-toggle-bar"
        id="labelToggleBar"
        title="开启后显示点要素标签"
      >
        <label class="cluster-toggle-label">
          <span class="cluster-toggle-text">显示标签</span>
          <input type="checkbox" id="labelToggle" checked />
          <span class="cluster-toggle-switch"></span>
        </label>
      </div>
      <div id="layerItemsContainer"></div>
      <div id="appVersion" class="app-version"></div>
    </div>
    <!-- 右侧地图容器 -->
    <div id="map"></div>
    <!-- 基础设定JS脚本 -->
    <script>
      // 天地图TK配置
      const TDT_TK = "13f1ff3b1c59a59cea87cf63950b4888";

      L.CRS.EPSG3857.projection.MAX_LATITUDE = 89;

      // 初始化地图容器
      map = L.map("map", {
        maxZoom: 21,
        zoomControl: true,
        attributionControl: false,
        maxBounds: [
          [-89.8, -Infinity],
          [89.8, Infinity],
        ],
        maxBoundsViscosity: 1.0,
      }).setView([32, 107], 3);

      // 2. 比例尺控件
      L.control
        .scale({
          imperial: false,
          maxWidth: 100,
          position: "bottomleft",
        })
        .addTo(map);

      // 从 service-worker.js 读取 CACHE_NAME 保持版本同步
      // 版本号显示在图层面板底部
      fetch("service-worker.js")
        .then(function (r) {
          return r.text();
        })
        .then(function (src) {
          var m = src.match(/CACHE_NAME\s*=\s*["']([^"']+)["']/);
          if (m) {
            document.getElementById("appVersion").textContent = m[1];
          }
        })
        .catch(function () {});

      // 版本号双击 → 显示清理选项
      (function () {
        var el = document.getElementById("appVersion");
        if (!el) return;

        function clearSWCache() {
          if (!window.caches) return Promise.resolve();
          return caches.keys().then(function (names) {
            return Promise.all(
              names.map(function (n) {
                return caches.delete(n);
              }),
            );
          });
        }
        function clearIDB() {
          if (
            window.L &&
            window.L.GzIdbLoader &&
            window.L.GzIdbLoader.clearCache
          ) {
            return window.L.GzIdbLoader.clearCache();
          }
          return new Promise(function (resolve) {
            var req = indexedDB.deleteDatabase("GzGeoJSONCache");
            req.onsuccess = req.onerror = resolve;
          });
        }
        function doRefresh(all) {
          var tasks = [clearSWCache()];
          if (all) tasks.push(clearIDB());
          Promise.all(tasks).then(function () {
            location.reload(true);
          });
        }
        function toggleMenu() {
          var menu = el.querySelector(".refresh-menu");
          if (menu) {
            menu.remove();
            return;
          }
          menu = document.createElement("div");
          menu.className = "refresh-menu";
          menu.innerHTML =
            '<button data-mode="sw">清理网页缓存</button>' +
            '<button data-mode="all">彻底清理</button>';
          menu.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-mode]");
            if (!btn) return;
            menu.remove();
            doRefresh(btn.dataset.mode === "all");
          });
          el.appendChild(menu);
        }

        el.addEventListener("click", function (e) {
          e.stopPropagation();
          toggleMenu();
        });
      })();

      // 更新提示 toast
      window._showUpdateToast = function () {
        if (document.getElementById("updateToast")) return;
        const toast = document.createElement("div");
        toast.id = "updateToast";
        toast.className = "update-toast";
        toast.innerHTML =
          '<span>新版本可用，点击刷新</span><button onclick="location.reload()">刷新</button>';
        document.body.appendChild(toast);
      };
      if (window._swUpdateAvailable && window._showUpdateToast) {
        window._showUpdateToast();
      }

      // 3. 鼠标坐标控件
      L.control
        .mousePosition({
          position: "topright",
          showZoom: true,
          zoomLabel: "缩放: {zoom} ",
          format: "经度: {lng}, 纬度: {lat}",
          precision: 5,
          showFullscreen: true,
        })
        .addTo(map);

      // ========== 底图图层定义 ==========
      // 0. 天地图全球境界底图
      const tdtIboLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=ibo_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18 },
      );
      // 1. 天地图影像底图
      const tdtImgLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          maxZoom: 18,
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图影像</a>",
        },
      );
      const tdtImgAnno = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cia_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18 },
      );
      const imgLayers = L.layerGroup([tdtImgLayer, tdtImgAnno]);
      const tdtImgLayer2 = tdtImgLayer;
      // 2. 天地图矢量底图
      const tdtVecLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          maxZoom: 18,
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图矢量</a>",
        },
      );
      const tdtVecAnno = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cva_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18 },
      );
      const vecLayers = L.layerGroup([tdtVecLayer, tdtVecAnno]);

      // 2.1 天地图地形底图
      const tdtTerLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=ter_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          maxZoom: 18,
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图地形</a>",
        },
      );
      const tdtTerAnno = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cta_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18 },
      );
      const terLayers = L.layerGroup([tdtTerLayer, tdtTerAnno]);

      // 3. ArcGIS影像底图
      const ARCGIS_SERVICE_PREFIX =
        "//server.arcgisonline.com/ArcGIS/rest/services/";

      function createArcGISBaseLayer(config, boundaryLayer = null) {
        // 拼接完整的服务地址（公共前缀 + 服务名称 + /MapServer）
        const getFullServiceUrl = (serviceName) =>
          `${ARCGIS_SERVICE_PREFIX}${serviceName}/MapServer`;

        // 1. 创建基础瓦片图层
        const baseLayer = L.tileLayer(
          `${getFullServiceUrl(config.serviceName)}/tile/{z}/{y}/{x}`,
          {
            maxZoom: config.maxZoom || 19,
            attribution: `<a href='https://www.arcgis.com/' target='_blank'>ArcGIS Online ${config.name}</a>`,
          },
        );

        // 2. 若有标注图层，一起组合
        let layersToGroup = [baseLayer];
        if (config.labelServiceName) {
          const labelLayer = L.tileLayer(
            `${getFullServiceUrl(config.labelServiceName)}/tile/{z}/{y}/{x}`,
            { maxZoom: config.maxZoom || 19 },
          );
          layersToGroup.push(labelLayer);
        }

        // 3. 叠加境界图层（如果传入）
        if (boundaryLayer) {
          layersToGroup.push(boundaryLayer);
        }

        // 4. 创建图层组并返回
        return {
          layerName: config.name,
          layer: L.layerGroup(layersToGroup),
        };
      }

      // ========== 3. ArcGIS 底图配置 ==========
      /**
       * 创建 ArcGIS 官方瓦片底图图层
       * @param {Object} config - 底图配置项
       * @param {string} config.name - 底图名称（用于控件显示）
       * @param {string} config.serviceName - ArcGIS 服务名称（拼接前缀后得到完整地址）
       * @param {number} config.maxZoom - 最大缩放层级
       * @param {Layer} boundaryLayer - 可选，叠加的境界图层（如 tdtIboLayer）
       * @param {string} config.labelServiceName - 可选，标注图层的服务名称
       * @returns {Object} { layerName: 图层名称, layer: 组合后的图层组 }
       */
      const arcgisBaseLayerConfigs = [
        // 影像底图
        { name: "ArcGIS-影像底图", serviceName: "World_Imagery", maxZoom: 19 },
        // 街道底图
        {
          name: "ArcGIS-街道底图",
          serviceName: "World_Street_Map",
        },
        // 海洋底图
        {
          name: "ArcGIS-海洋底图",
          serviceName: "Ocean/World_Ocean_Base",
          labelServiceName: "Ocean/World_Ocean_Reference",
          maxZoom: 10,
        },
        // 物理地图
        {
          name: "ArcGIS-物理地图",
          serviceName: "World_Physical_Map",
        },
        // 阴影地形图
        {
          name: "ArcGIS-山体阴影地形图",
          serviceName: "World_Shaded_Relief",
          maxZoom: 13,
        },
        // 世界地形底图
        {
          name: "ArcGIS-世界地形基础底图",
          serviceName: "World_Terrain_Base",
          maxZoom: 19,
        },
        // 地形底图
        { name: "ArcGIS-地形底图", serviceName: "World_Topo_Map", maxZoom: 19 },
      ];

      // ========== 4. 批量创建所有 ArcGIS 底图图层 ==========
      const arcgisBaseLayers = {};
      arcgisBaseLayerConfigs.forEach((config) => {
        const result = createArcGISBaseLayer(config, tdtIboLayer);
        arcgisBaseLayers[result.layerName] = result.layer;
      });

      // 打底的ArcGIS影像底图
      const arcgisLayers = L.tileLayer(
        "//server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 23 },
      );

      // 4. OSM底图
      const osmLayer = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution:
            "<a href='https://www.openstreetmap.org/' target='_blank'>OpenStreetMap</a>",
        },
      );
      const osmLayers = L.layerGroup([osmLayer]);

      // ========== 控件配置 ==========
      // 1. 底图切换控件
      L.control
        .layers(
          {
            // 天地图系列
            天地图纯影像: tdtImgLayer2,
            天地图影像底图: imgLayers,
            天地图矢量底图: vecLayers,
            天地图地形底图: terLayers,
            // ArcGIS系列
            ...arcgisBaseLayers,
            // OSM
            OSM底图_边界有误慎用: osmLayers,
            // 全球境界: tdtIboLayer,
          },
          {
            全球境界: tdtIboLayer,
          },
          {
            position: "bottomright",
            collapsed: true,
            autoZIndex: true,
          },
        )
        .addTo(map);

      // 设置默认底图
      arcgisBaseLayers["ArcGIS-海洋底图"].addTo(map);
      tdtIboLayer.addTo(map);

      // ========== Leaflet-Geoman 测量工具 ==========
      map.pm.addControls({
        position: "topright",
        drawCircleMarker: true,
        drawText: true,
        drawMarker: false,
        drawCircle: true,
        drawPolyline: true,
        drawPolygon: true,
        drawRectangle: false,
        editMode: false,
        dragMode: true,
        cutPolygon: false,
        rotateMode: false,
        removalMode: true,
      });

      // 设置测量提示文本为中文
      map.pm.setLang("zh");

      // 监听绘制完成事件，显示测量结果
      map.on("pm:create", function (e) {
        const layer = e.layer;
        let measurement = "";

        if (e.shape === "Line") {
          // 计算线段长度
          const latlngs = layer.getLatLngs();
          let totalDistance = 0;
          for (let i = 0; i < latlngs.length - 1; i++) {
            totalDistance += latlngs[i].distanceTo(latlngs[i + 1]);
          }
          measurement = formatDistance(totalDistance);
        } else if (e.shape === "Polygon" || e.shape === "Rectangle") {
          // 计算面积
          const latlngs = layer.getLatLngs()[0];
          const area = calculatePolygonArea(latlngs);
          measurement = formatArea(area);
        }

        if (measurement) {
          layer.bindPopup(measurement).openPopup();
        }
      });

      // 格式化距离显示
      function formatDistance(meters) {
        if (meters >= 1000) {
          return "距离: " + (meters / 1000).toFixed(2) + " km";
        }
        return "距离: " + meters.toFixed(2) + " m";
      }

      // 格式化面积显示
      function formatArea(sqMeters) {
        if (sqMeters >= 1000000) {
          return "面积: " + (sqMeters / 1000000).toFixed(2) + " km²";
        }
        return "面积: " + sqMeters.toFixed(2) + " m²";
      }

      // 计算多边形面积（使用球面几何）
      function calculatePolygonArea(latlngs) {
        if (latlngs.length < 3) return 0;
        let area = 0;
        const R = 6371000; // 地球半径（米）

        for (let i = 0; i < latlngs.length; i++) {
          const j = (i + 1) % latlngs.length;
          const p1 = latlngs[i];
          const p2 = latlngs[j];

          const lat1 = (p1.lat * Math.PI) / 180;
          const lat2 = (p2.lat * Math.PI) / 180;
          const lng1 = (p1.lng * Math.PI) / 180;
          const lng2 = (p2.lng * Math.PI) / 180;

          area += (lng2 - lng1) * (2 + Math.sin(lat1) + Math.sin(lat2));
        }

        area = (Math.abs(area) * R * R) / 2;
        return area;
      }

      // ========== 外部文件处理（支持 GeoJSON / SHP / KML / KMZ → 统一走 addUserLayer）==========
      window.loadFileAsUserLayer = function loadFileAsUserLayer(file) {
        var ext = (file.name.split(".").pop() || "").toLowerCase();
        var geojsonExts = ["geojson", "json"];
        var shpExts = ["shp", "zip"];
        var kmlExts = ["kml"];
        var kmzExts = ["kmz"];

        if (geojsonExts.indexOf(ext) !== -1) {
          // --- GeoJSON / JSON ---
          window.showLoading("正在读取文件...");
          var reader = new FileReader();
          reader.onload = function (ev) {
            window.showLoading("正在解析数据...");
            setTimeout(function () {
              try {
                var data = JSON.parse(ev.target.result);
                deliverToMap(data, file.name);
              } catch (err) {
                window.hideLoading();
                alert("GeoJSON 解析失败：" + file.name + "\n" + err.message);
              }
            }, 50);
          };
          reader.onerror = function () {
            window.hideLoading();
            alert("文件读取失败：" + (file.name || ""));
          };
          reader.readAsText(file);

        } else if (shpExts.indexOf(ext) !== -1) {
          // --- Shapefile (.shp 或打包为 .zip) ---
          if (typeof shp !== "function") {
            alert("shpjs 库尚未加载，请检查网络连接后刷新页面。");
            return;
          }
          window.showLoading("正在读取 Shapefile...");
          var reader2 = new FileReader();
          reader2.onload = function (ev) {
            window.showLoading("正在解析 Shapefile...");
            setTimeout(function () {
              shp(ev.target.result).then(function (result) {
                // shp() 可能返回 FeatureCollection 或 FeatureCollection[]
                var fc = Array.isArray(result) ? mergeFeatureCollections(result) : result;
                deliverToMap(fc, file.name);
              }).catch(function (err) {
                window.hideLoading();
                alert("Shapefile 解析失败：" + file.name + "\n" + err.message);
              });
            }, 50);
          };
          reader2.onerror = function () {
            window.hideLoading();
            alert("文件读取失败：" + (file.name || ""));
          };
          reader2.readAsArrayBuffer(file);

        } else if (kmlExts.indexOf(ext) !== -1) {
          // --- KML ---
          if (typeof toGeoJSON === "undefined") {
            alert("toGeoJSON 库尚未加载，请检查网络连接后刷新页面。");
            return;
          }
          window.showLoading("正在读取 KML...");
          var reader3 = new FileReader();
          reader3.onload = function (ev) {
            window.showLoading("正在解析 KML...");
            setTimeout(function () {
              try {
                var parser = new DOMParser();
                var xmlDoc = parser.parseFromString(ev.target.result, "text/xml");
                var fc = toGeoJSON.kml(xmlDoc);
                deliverToMap(fc, file.name);
              } catch (err) {
                window.hideLoading();
                alert("KML 解析失败：" + file.name + "\n" + err.message);
              }
            }, 50);
          };
          reader3.onerror = function () {
            window.hideLoading();
            alert("文件读取失败：" + (file.name || ""));
          };
          reader3.readAsText(file);

        } else if (kmzExts.indexOf(ext) !== -1) {
          // --- KMZ（zip 内含 doc.kml）---
          if (typeof JSZip === "undefined") {
            alert("JSZip 库尚未加载，请检查网络连接后刷新页面。");
            return;
          }
          if (typeof toGeoJSON === "undefined") {
            alert("toGeoJSON 库尚未加载，请检查网络连接后刷新页面。");
            return;
          }
          window.showLoading("正在读取 KMZ...");
          var reader4 = new FileReader();
          reader4.onload = function (ev) {
            window.showLoading("正在解析 KMZ...");
            setTimeout(function () {
              JSZip.loadAsync(ev.target.result).then(function (zip) {
                // 查找 kml 文件（优先 doc.kml）
                var kmlFile = null;
                var kmlNames = ["doc.kml", "Doc.kml", "DOC.KML"];
                for (var i = 0; i < kmlNames.length; i++) {
                  if (zip.file(kmlNames[i])) {
                    kmlFile = zip.file(kmlNames[i]);
                    break;
                  }
                }
                if (!kmlFile) {
                  // 回退：找第一个 .kml 文件
                  zip.forEach(function (relativePath, zipEntry) {
                    if (!kmlFile && /\.kml$/i.test(relativePath)) {
                      kmlFile = zipEntry;
                    }
                  });
                }
                if (!kmlFile) {
                  window.hideLoading();
                  alert("KMZ 中未找到 KML 文件");
                  return;
                }
                return kmlFile.async("text");
              }).then(function (kmlText) {
                if (!kmlText) return;
                var parser = new DOMParser();
                var xmlDoc = parser.parseFromString(kmlText, "text/xml");
                var fc = toGeoJSON.kml(xmlDoc);
                deliverToMap(fc, file.name);
              }).catch(function (err) {
                window.hideLoading();
                alert("KMZ 解析失败：" + file.name + "\n" + err.message);
              });
            }, 50);
          };
          reader4.onerror = function () {
            window.hideLoading();
            alert("文件读取失败：" + (file.name || ""));
          };
          reader4.readAsArrayBuffer(file);

        } else {
          alert("不支持的文件格式：" + ext + "\n支持格式：GeoJSON、JSON、SHP（zip打包）、KML、KMZ");
        }
      };

      // 合并多个 FeatureCollection 为一个
      function mergeFeatureCollections(arr) {
        var merged = { type: "FeatureCollection", features: [] };
        arr.forEach(function (fc) {
          if (fc && fc.features) {
            merged.features = merged.features.concat(fc.features);
          }
        });
        return merged;
      }

      // 统一交付给地图图层
      function deliverToMap(data, fileName) {
        if (typeof window.addUserLayer === "function") {
          window.addUserLayer(data, fileName);
          var layerPanel = document.getElementById("layerPanel");
          if (layerPanel) layerPanel.classList.add("active");
        }
        window.hideLoading();
      }

      // 暂存：geojsonloader.js 尚未就绪时收到的文件
      var _pendingFiles = [];

      // File Handling API：PWA 关联打开文件
      if ("launchQueue" in window) {
        launchQueue.setConsumer(function (launchParams) {
          launchParams.files.forEach(function (fileHandle) {
            fileHandle
              .getFile()
              .then(function (file) {
                if (typeof window.addUserLayer === "function") {
                  loadFileAsUserLayer(file);
                } else {
                  // geojsonloader 还未就绪，先暂存
                  _pendingFiles.push(file);
                }
              })
              .catch(function (err) {
                console.error("读取文件失败：", err);
              });
          });
        });
      }

      // 拖放支持：拖入地图页面
      document.addEventListener("dragover", function (e) {
        e.preventDefault();
        e.stopPropagation();
      });
      document.addEventListener("drop", function (e) {
        e.preventDefault();
        e.stopPropagation();
        Array.from(e.dataTransfer.files).forEach(function (file) {
          if (/\.(geojson|json|shp|zip|kml|kmz)$/i.test(file.name)) {
            loadFileAsUserLayer(file);
            // 确保左侧面板打开
            var layerPanel = document.getElementById("layerPanel");
            if (layerPanel) layerPanel.classList.add("active");
          }
        });
      });
    </script>
    <!-- 文件加载缓冲示意 -->
    <div id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div id="loadingMessage"></div>
    </div>
    <script>
      window.showLoading = function (msg) {
        var el = document.getElementById("loadingOverlay");
        var msgEl = document.getElementById("loadingMessage");
        if (el) el.classList.add("active");
        if (msgEl) msgEl.textContent = msg || "加载中...";
      };
      window.hideLoading = function () {
        var el = document.getElementById("loadingOverlay");
        if (el) el.classList.remove("active");
      };
    </script>
    <!-- geojson图层加载器 -->
    <script src="./assets/geojsonloader.js"></script>
  </body>
</html>
