    <script>
      // 尽早捕获 PWA 安装提示事件（供 Leaflet.MousePosition 插件使用）
      window._pwaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        // 不拦截，让浏览器也可以自动弹窗；同时记录事件供自定义按钮使用
        window._pwaInstallPrompt = e;
      });

      // 检查浏览器是否支持Service Worker
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("service-worker.js")
            .then((registration) => {
              // 检测新版本：SW 文件变化时会触发 updatefound
              registration.addEventListener("updatefound", () => {
                const newWorker = registration.installing;
                newWorker.addEventListener("statechange", () => {
                  if (
                    newWorker.state === "installed" &&
                    navigator.serviceWorker.controller
                  ) {
                    // 新 SW 已安装且旧 SW 仍在控制页面 → 有更新可用
                    window._swUpdateAvailable = true;
                    if (window._showUpdateToast) window._showUpdateToast();
                  }
                });
              });
            })
            .catch((error) => {
              console.error("Service Worker注册失败：", error);
            });
        });
      }
    </script>

    <!-- 基础设定JS脚本 -->
    <script>
      // 天地图TK配置
      const TDT_TK = "13f1ff3b1c59a59cea87cf63950b4888";

      // L.CRS.EPSG3857.projection.MAX_LATITUDE = 89;

      // 初始化地图容器
      map = L.map("map", {
        maxZoom: 19,
        zoomControl: true,
        attributionControl: false,
        maxBounds: [
          [-89.8, -Infinity],
          [89.8, Infinity],
        ],
        maxBoundsViscosity: 1.0,
      }).setView([32, 107], 3);

      // 2. 比例尺控件
      var scaleControl = L.control
        .scale({
          imperial: false,
          maxWidth: 100,
          position: "bottomleft",
        })
        .addTo(map);

      // 从 service-worker.js 读取 CACHE_NAME 保持版本同步
      // 版本号显示在图层面板底部，也用于 PWA 更新弹窗
      var _appVersion = "";
      fetch("service-worker.js")
        .then(function (r) {
          return r.text();
        })
        .then(function (src) {
          var m = src.match(/CACHE_NAME\s*=\s*["']([^"']+)["']/);
          if (m) {
            _appVersion = m[1];
            document.getElementById("appVersion").textContent = m[1];
          }
        })
        .catch(function () {});

      // 版本号双击 → 显示清理选项
      (function () {
        var el = document.getElementById("appVersion");
        if (!el) return;

        function clearSWCache() {
          if (!window.caches) return Promise.resolve();
          return caches.keys().then(function (names) {
            return Promise.all(
              names.map(function (n) {
                return caches.delete(n);
              }),
            );
          });
        }
        function clearIDB() {
          if (
            window.L &&
            window.L.GzIdbLoader &&
            window.L.GzIdbLoader.clearCache
          ) {
            return window.L.GzIdbLoader.clearCache();
          }
          return new Promise(function (resolve) {
            var req = indexedDB.deleteDatabase("GzGeoJSONCache");
            req.onsuccess = req.onerror = resolve;
          });
        }
        function doRefresh(all) {
          localStorage.clear(); // 清理用户设置（底图选择等）
          var tasks = [clearSWCache()];
          if (all) tasks.push(clearIDB());
          Promise.all(tasks).then(function () {
            location.reload(true);
          });
        }
        function toggleMenu() {
          // 菜单是 #appVersion 的前一个兄弟节点
          var menu = el.previousElementSibling;
          if (!menu || !menu.classList.contains("refresh-menu")) {
            menu = null;
          }
          if (menu) {
            menu.remove();
            return;
          }
          menu = document.createElement("div");
          menu.className = "refresh-menu";
          menu.innerHTML =
            '<button data-mode="export">📷 导出图片</button>' +
            '<button data-mode="refresh">刷新页面</button>' +
            '<button data-mode="sw">清理网页缓存</button>' +
            '<button data-mode="all">彻底清理</button>';
          menu.addEventListener("click", function (e) {
            var btn = e.target.closest("[data-mode]");
            if (!btn) return;
            menu.remove();
            if (btn.dataset.mode === "export") {
              exportMapImage();
            } else if (btn.dataset.mode === "refresh") {
              location.reload();
            } else {
              doRefresh(btn.dataset.mode === "all");
            }
          });
          // 插入到 #appVersion 前面（版号上方）
          el.parentNode.insertBefore(menu, el);
        }

        el.addEventListener("click", function (e) {
          e.stopPropagation();
          toggleMenu();
        });
      })();

      // ========== 导出地图图片（html2canvas 截图）==========
      function exportMapImage() {
        if (!window.map || !window.htmlToImage) return;
        // 先关掉上一次的导出提示
        if (window._exportToast) {
          closeToast(window._exportToast);
          window._exportToast = null;
        }
        window._exportToast = showToast(
          "⏳ 正在导出地图图片，图层复杂时可能较慢，请勿操作…",
          { duration: 0 },
        );
        var mapEl = document.getElementById("map");
        var panel = document.getElementById("layerPanel");
        var trigger = document.getElementById("layerTrigger");

        // 控制节点通过 toPng 的 filter 回调排除，无需移出 DOM

        // 隐藏侧边栏
        var panelWasActive = panel && panel.classList.contains("active");
        if (panelWasActive) panel.classList.remove("active");
        if (trigger) trigger.style.display = "none";

        // 等一帧 + 等瓦片加载完，再截图，避免底图错位
        requestAnimationFrame(function () {
          var tileLayers = [];
          map.eachLayer(function (layer) {
            if (layer instanceof L.TileLayer && layer._map) {
              tileLayers.push(layer);
            }
          });

          // 等待所有瓦片加载完成（最多等 3 秒）
          var waitTiles = function (cb) {
            if (tileLayers.length === 0) {
              cb();
              return;
            }
            var loaded = 0;
            var done = false;
            tileLayers.forEach(function (ly) {
              if (ly._loading) {
                ly.once("load", function () {
                  loaded++;
                  if (!done && loaded >= tileLayers.length) {
                    done = true;
                    cb();
                  }
                });
              } else {
                loaded++;
              }
            });
            if (!done && loaded >= tileLayers.length) {
              cb();
              return;
            }
            // 超时保护
            setTimeout(function () {
              if (!done) {
                done = true;
                cb();
              }
            }, 3000);
          };

          waitTiles(function () {
            // 摊平 Leaflet pane 的 transform，避免 html-to-image 处理 translate3d 出错
            // 原理：读取 pane 的 translate3d(x, y, z)，改成 left/top 定位，清空 transform
            var savedPanes = [];
            var panes = mapEl.querySelectorAll(".leaflet-pane");
            panes.forEach(function (pane) {
              var st = window.getComputedStyle(pane);
              var tx = st.transform;
              if (!tx || tx === "none") return;
              // 解析 matrix/matrix3d
              var mat = tx.match(/matrix(?:3d)?\(([^)]+)\)/);
              if (!mat) return;
              var vals = mat[1].split(",").map(parseFloat);
              var px = 0,
                py = 0;
              if (tx.indexOf("matrix3d") === 0) {
                px = vals[12];
                py = vals[13];
              } else {
                px = vals[4];
                py = vals[5];
              }
              if (Math.abs(px) < 0.5 && Math.abs(py) < 0.5) return;
              var pos =
                pane.style.position || window.getComputedStyle(pane).position;
              savedPanes.push({
                el: pane,
                transform: pane.style.transform,
                left: pane.style.left,
                top: pane.style.top,
                position: pane.style.position,
              });
              pane.style.transform = "";
              pane.style.position = "absolute";
              pane.style.left = pane.offsetLeft + px + "px";
              pane.style.top = pane.offsetTop + py + "px";
            });

            htmlToImage
              .toPng(mapEl, {
                backgroundColor: "#fff",
                pixelRatio: Math.min(window.devicePixelRatio || 2, 3),
                filter: function (node) {
                  if (!node || !node.classList) return true;
                  if (node.closest) {
                    return !node.closest(
                      ".leaflet-control-container, .leaflet-control, .leaflet-popup, .leaflet-tooltip",
                    );
                  }
                  return true;
                },
              })
              .then(function (dataUrl) {
                // 恢复 pane 的 transform
                savedPanes.forEach(function (item) {
                  item.el.style.transform = item.transform;
                  item.el.style.left = item.left;
                  item.el.style.top = item.top;
                  item.el.style.position = item.position;
                });
                if (panelWasActive && panel) panel.classList.add("active");
                if (trigger) trigger.style.display = "";
                map.invalidateSize();

                var now = new Date();
                var ts = [now.getHours(), now.getMinutes(), now.getSeconds()]
                  .map(function (n) {
                    return String(n).padStart(2, "0");
                  })
                  .join("");
                var a = document.createElement("a");
                a.download = "OGV_" + ts + ".png";
                a.href = dataUrl;
                a.click();
                if (window._exportToast) {
                  closeToast(window._exportToast);
                  window._exportToast = null;
                }
                showToast("✅ 导出成功", { duration: 3000 });
              })
              .catch(function () {
                // 恢复 pane 的 transform
                savedPanes.forEach(function (item) {
                  item.el.style.transform = item.transform;
                  item.el.style.left = item.left;
                  item.el.style.top = item.top;
                  item.el.style.position = item.position;
                });
                if (panelWasActive && panel) panel.classList.add("active");
                if (trigger) trigger.style.display = "";
                map.invalidateSize();
                if (window._exportToast) {
                  closeToast(window._exportToast);
                  window._exportToast = null;
                }
                showToast("❌ 导出失败", { duration: 3000 });
              });
          });
        });
      }

      // Ctrl+E 快捷键导出图片
      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "e") {
          e.preventDefault();
          exportMapImage();
        }
      });

      // 更新提示 toast
      window._showUpdateToast = function () {
        var msg = _appVersion
          ? "新版本 " + _appVersion + " 已就绪"
          : "📦 新版本可用";
        showToast(msg, {
          duration: 0,
          action: "刷新",
          onAction: function () {
            location.reload();
          },
        });
      };
      if (window._swUpdateAvailable) window._showUpdateToast();

      // 3. 鼠标坐标控件
      var mousePosControl = L.control
        .mousePosition({
          position: "topright",
          showZoom: true,
          zoomLabel: "缩放: {zoom} ",
          format: "经度: {lng}, 纬度: {lat}",
          precision: 5,
          showFullscreen: true,
        })
        .addTo(map);

      // ========== 底图图层定义 ==========
      // 0. 天地图全球境界底图
      const tdtIboLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=ibo_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18, crossOrigin: "anonymous" },
      );
      // 1. 天地图影像底图
      const tdtImgLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          maxZoom: 18,
          crossOrigin: "anonymous",
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图影像</a>",
        },
      );
      const imgLayers = L.layerGroup([tdtImgLayer]);
      // 2. 天地图矢量底图
      const tdtVecLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          maxZoom: 18,
          crossOrigin: "anonymous",
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图矢量</a>",
        },
      );
      const vecLayers = L.layerGroup([tdtVecLayer]);

      // 2.1 天地图地形底图
      const tdtTerLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=ter_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          maxZoom: 18,
          crossOrigin: "anonymous",
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图地形</a>",
        },
      );
      const terLayers = L.layerGroup([tdtTerLayer]);

      // 天地图地名标注（独立叠加层，供多选图层使用）
      const tdtAnnoOverlay = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cva_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18, crossOrigin: "anonymous" },
      );
      // 天地图影像标注 / 地形标注（更多底图中可切换对比）
      const tdtImgAnno = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cia_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18, crossOrigin: "anonymous" },
      );
      const tdtTerAnno = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cta_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18, crossOrigin: "anonymous" },
      );

      // 3. ArcGIS影像底图
      const ARCGIS_SERVICE_PREFIX =
        "https://server.arcgisonline.com/ArcGIS/rest/services/";

      function createArcGISBaseLayer(config, boundaryLayer = null) {
        // 拼接完整的服务地址（公共前缀 + 服务名称 + /MapServer）
        const getFullServiceUrl = (serviceName) =>
          `${ARCGIS_SERVICE_PREFIX}${serviceName}/MapServer`;

        // 1. 创建基础瓦片图层
        const baseLayer = L.tileLayer(
          `${getFullServiceUrl(config.serviceName)}/tile/{z}/{y}/{x}`,
          {
            maxZoom: config.maxZoom || 19,
            crossOrigin: "anonymous",
            attribution: `<a href='https://www.arcgis.com/' target='_blank'>ArcGIS Online ${config.name}</a>`,
          },
        );

        // 2. 若有标注图层，一起组合
        let layersToGroup = [baseLayer];
        if (config.labelServiceName) {
          const labelLayer = L.tileLayer(
            `${getFullServiceUrl(config.labelServiceName)}/tile/{z}/{y}/{x}`,
            { maxZoom: config.maxZoom || 19, crossOrigin: "anonymous" },
          );
          layersToGroup.push(labelLayer);
        }

        // 3. 叠加境界图层（如果传入）
        if (boundaryLayer) {
          layersToGroup.push(boundaryLayer);
        }

        // 4. 创建图层组并返回
        return {
          layerName: config.name,
          layer: L.layerGroup(layersToGroup),
        };
      }

      // ========== 3. ArcGIS 底图配置 ==========
      /**
       * 创建 ArcGIS 官方瓦片底图图层
       * @param {Object} config - 底图配置项
       * @param {string} config.name - 底图名称（用于控件显示）
       * @param {string} config.serviceName - ArcGIS 服务名称（拼接前缀后得到完整地址）
       * @param {number} config.maxZoom - 最大缩放层级
       * @param {Layer} boundaryLayer - 可选，叠加的境界图层（如 tdtIboLayer）
       * @param {string} config.labelServiceName - 可选，标注图层的服务名称
       * @returns {Object} { layerName: 图层名称, layer: 组合后的图层组 }
       */
      const arcgisBaseLayerConfigs = [
        // 影像底图
        { name: "ArcGIS-影像", serviceName: "World_Imagery", maxZoom: 19 },
        // 街道底图
        {
          name: "ArcGIS-街道",
          serviceName: "World_Street_Map",
        },
        // 海洋底图
        {
          name: "ArcGIS-海洋",
          serviceName: "Ocean/World_Ocean_Base",
          labelServiceName: "Ocean/World_Ocean_Reference",
          maxZoom: 10,
        },
        // 物理地图
        {
          name: "ArcGIS-物理地图",
          serviceName: "World_Physical_Map",
        },
        // 阴影地形图
        {
          name: "ArcGIS-山体阴影地形图",
          serviceName: "World_Shaded_Relief",
          maxZoom: 13,
        },
        // 世界地形底图
        {
          name: "ArcGIS-世界地形",
          serviceName: "World_Terrain_Base",
          maxZoom: 19,
        },
        // 地形底图
        { name: "ArcGIS-地形", serviceName: "World_Topo_Map", maxZoom: 19 },
      ];

      // ========== 4. 批量创建所有 ArcGIS 底图图层 ==========
      const arcgisBaseLayers = {};
      arcgisBaseLayerConfigs.forEach((config) => {
        const result = createArcGISBaseLayer(config, tdtIboLayer);
        arcgisBaseLayers[result.layerName] = result.layer;
      });

      // 打底的 ArcGIS 影像（不是可切换的底图，仅用于 ETOPO 等高线叠加）
      const arcgisLayers = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 19, crossOrigin: "anonymous" },
      );

      // 4. OSM底图
      const osmLayer = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          crossOrigin: "anonymous",
          attribution:
            "<a href='https://www.openstreetmap.org/' target='_blank'>OpenStreetMap</a>",
        },
      );
      const osmLayers = L.layerGroup([osmLayer, tdtIboLayer]);

      // 5. ETOPO 2022 全球底图（支持跨180°三副本）
      // 辅助函数：为图像底图创建三份副本，分别偏移 -360°/0°/+360°，实现跨180°无缝显示
      function createWorldCopyImageOverlay(url, bounds, options) {
        var south = bounds[0][0];
        var west = bounds[0][1];
        var north = bounds[1][0];
        var east = bounds[1][1];
        return L.layerGroup([
          L.imageOverlay(
            url,
            [
              [south, west - 360],
              [north, east - 360],
            ],
            options,
          ),
          L.imageOverlay(
            url,
            [
              [south, west],
              [north, east],
            ],
            options,
          ),
          L.imageOverlay(
            url,
            [
              [south, west + 360],
              [north, east + 360],
            ],
            options,
          ),
        ]);
      }

      var etopoBounds = [
        [-85.06, -180],
        [85.06, 180],
      ];
      const etopoLayer = createWorldCopyImageOverlay(
        "./assets/xyz/etopo.jpg",
        etopoBounds,
        {
          attribution:
            '<a href="https://www.ngdc.noaa.gov/" target="_blank">ETOPO 2022</a>',
        },
      );
      const etopohighLayer = createWorldCopyImageOverlay(
        "./assets/xyz/etopo2022high.jpg",
        etopoBounds,
        {
          attribution:
            '<a href="https://www.ngdc.noaa.gov/" target="_blank">ETOPO 2022 HD</a>',
        },
      );

      // ========== 控件配置 ==========
      // 所有底图统一放在 allBaseLayers 对象中（单一数据源，避免与 L.control 定义不同步）
      // 注意顺序：先天地图系列，再 ArcGIS 系列，最后 OSM（确保 OSM 在控件列表最末尾）
      const allBaseLayers = Object.assign(
        {
          // ETOPO 2022 全球底图
          ETOPO: etopoLayer,
          ETOPO_2022: etopohighLayer,
          // 天地图系列
          天地图影像: imgLayers,
          天地图矢量: vecLayers,
          天地图地形: terLayers,
        },
        arcgisBaseLayers,
      );
      // OSM 放到 ArcGIS 底图后面
      allBaseLayers["OpenStreetMap"] = osmLayers;

      // 所有覆盖层统一存放（永远可见的 + 更多底图模式才显示的）
      const allOverlays = {
        // 永远可见
        天地图全球境界: tdtIboLayer,
        天地图地名标注: tdtAnnoOverlay,
      };
      const moreOverlays = {
        // 仅在"更多底图"开启时出现
        天地图影像标注: tdtImgAnno,
        天地图地形标注: tdtTerAnno,
      };

      // 获取当前可见覆盖层集合
      function getVisibleOverlays() {
        var cb = document.getElementById("moreBasemapToggle");
        if (cb && cb.checked) {
          var merged = {};
          for (var k in allOverlays) merged[k] = allOverlays[k];
          for (var k in moreOverlays) merged[k] = moreOverlays[k];
          return merged;
        }
        return allOverlays;
      }

      // ========== "更多底图"开关：控制 ArcGIS 扩展底图的显示 ==========
      // 默认显示的底图子集（关闭"更多底图"时）
      function getDefaultBaseLayers() {
        var layers = {};
        var keys = [
          "ETOPO",
          "ETOPO_2022",
          "天地图影像",
          "天地图矢量",
          "天地图地形",
          "ArcGIS-影像",
          "ArcGIS-海洋",
          "OpenStreetMap",
        ];
        keys.forEach(function (k) {
          if (allBaseLayers[k]) layers[k] = allBaseLayers[k];
        });
        return layers;
      }

      // 获取当前可见底图集合
      function getVisibleBaseLayers() {
        var cb = document.getElementById("moreBasemapToggle");
        if (cb && cb.checked) return allBaseLayers;
        return getDefaultBaseLayers();
      }

      // 当前选中的底图名称
      var _currentBasemapName = "ArcGIS-海洋";

      // 重建底图控件
      function rebuildLayerCtrl() {
        if (window._layerCtrlControl) {
          map.removeControl(window._layerCtrlControl);
        }
        var visibleLayers = getVisibleBaseLayers();

        // 确保当前底图在地图上且属于可见集合
        var currentLayer = allBaseLayers[_currentBasemapName];
        if (currentLayer && !map.hasLayer(currentLayer)) {
          // 移除所有其他底图
          for (var key in allBaseLayers) {
            if (map.hasLayer(allBaseLayers[key])) {
              map.removeLayer(allBaseLayers[key]);
            }
          }
          map.addLayer(currentLayer);
        } else if (!currentLayer) {
          // 兜底
          var fallback = allBaseLayers["ArcGIS-海洋"] || allBaseLayers["ETOPO"];
          if (fallback) map.addLayer(fallback);
        }

        window._layerCtrlControl = L.control
          .layers(visibleLayers, getVisibleOverlays(), {
            position: "bottomright",
            collapsed: true,
            autoZIndex: true,
          })
          .addTo(map);

        // 清理不在可见集合中的覆盖层（如切换"更多底图"关闭时）
        var visibleOverlays = getVisibleOverlays();
        for (var k in moreOverlays) {
          if (!visibleOverlays[k] && map.hasLayer(moreOverlays[k])) {
            map.removeLayer(moreOverlays[k]);
          }
        }
      }

      // ========== 更多底图开关初始化及事件绑定 ==========
      (function () {
        var cb = document.getElementById("moreBasemapToggle");
        if (cb) {
          var saved = localStorage.getItem("dupal_toggle_moreBasemap");
          cb.checked = saved !== null ? saved === "true" : false;
          cb.addEventListener("change", function () {
            localStorage.setItem(
              "dupal_toggle_moreBasemap",
              String(this.checked),
            );
            rebuildLayerCtrl();
          });
        }
      })();

      // ========== 自动识别剪贴板开关初始化 ==========
      (function () {
        var cb = document.getElementById("clipboardToggle");
        if (cb) {
          var saved = localStorage.getItem("dupal_toggle_clipboard");
          cb.checked = saved !== null ? saved === "true" : true; // 默认开启
          cb.addEventListener("change", function () {
            localStorage.setItem(
              "dupal_toggle_clipboard",
              String(this.checked),
            );
          });
        }
      })();

      // ========== 底图持久化：记住用户上次选择 ==========
      var BASEMAP_STORAGE_KEY = "dupal_basemap";

      // 尝试恢复上次选择的底图，没有则用 ArcGIS-海洋
      var savedBasemap = localStorage.getItem(BASEMAP_STORAGE_KEY);
      if (savedBasemap && allBaseLayers[savedBasemap]) {
        _currentBasemapName = savedBasemap;
      }

      // 初始化底图控件（自动根据更多底图开关状态选择子集）
      rebuildLayerCtrl();

      // ========== 覆盖层持久化：记住用户上次选择的覆盖层 ==========
      var OVERLAY_STORAGE_KEY = "dupal_overlays";

      // 合并所有覆盖层到一个查找表
      var allOverlaysLookup = {};
      for (var k in allOverlays) allOverlaysLookup[k] = allOverlays[k];
      for (var k in moreOverlays) allOverlaysLookup[k] = moreOverlays[k];

      // 尝试恢复上次选中的覆盖层
      try {
        var savedOverlays = JSON.parse(
          localStorage.getItem(OVERLAY_STORAGE_KEY),
        );
        if (!Array.isArray(savedOverlays)) savedOverlays = [];
      } catch (e) {
        savedOverlays = [];
      }
      savedOverlays.forEach(function (name) {
        if (allOverlaysLookup[name] && !map.hasLayer(allOverlaysLookup[name])) {
          map.addLayer(allOverlaysLookup[name]);
        }
      });

      // 切换底图时保存选择
      map.on("baselayerchange", function (e) {
        _currentBasemapName = e.name;
        localStorage.setItem(BASEMAP_STORAGE_KEY, e.name);
      });

      // 覆盖层选中/取消时保存选择
      map.on("overlayadd", function (e) {
        try {
          var list =
            JSON.parse(localStorage.getItem(OVERLAY_STORAGE_KEY)) || [];
          if (list.indexOf(e.name) === -1) {
            list.push(e.name);
            localStorage.setItem(OVERLAY_STORAGE_KEY, JSON.stringify(list));
          }
        } catch (ex) {}
      });
      map.on("overlayremove", function (e) {
        try {
          var list =
            JSON.parse(localStorage.getItem(OVERLAY_STORAGE_KEY)) || [];
          var idx = list.indexOf(e.name);
          if (idx !== -1) {
            list.splice(idx, 1);
            localStorage.setItem(OVERLAY_STORAGE_KEY, JSON.stringify(list));
          }
        } catch (ex) {}
      });

      // ========== Leaflet-Geoman 测量工具 ==========
      map.pm.addControls({
        position: "topright",
        drawCircleMarker: true,
        drawText: true,
        drawMarker: false,
        drawCircle: true,
        drawPolyline: true,
        drawPolygon: true,
        drawRectangle: false,
        editMode: false,
        dragMode: true,
        cutPolygon: false,
        rotateMode: false,
        removalMode: true,
      });

      // 设置测量提示文本为中文
      map.pm.setLang("zh");

      // 监听绘制完成事件，显示测量结果
      map.on("pm:create", function (e) {
        const layer = e.layer;
        let measurement = "";

        if (e.shape === "Line") {
          // 计算线段长度
          const latlngs = layer.getLatLngs();
          let totalDistance = 0;
          for (let i = 0; i < latlngs.length - 1; i++) {
            totalDistance += latlngs[i].distanceTo(latlngs[i + 1]);
          }
          measurement = formatDistance(totalDistance);
        } else if (e.shape === "Polygon" || e.shape === "Rectangle") {
          // 计算面积
          const latlngs = layer.getLatLngs()[0];
          const area = calculatePolygonArea(latlngs);
          measurement = formatArea(area);
        }

        if (measurement) {
          layer.bindPopup(measurement).openPopup();
        }
      });

      // 格式化距离显示
      function formatDistance(meters) {
        if (meters >= 1000) {
          return "距离: " + (meters / 1000).toFixed(2) + " km";
        }
        return "距离: " + meters.toFixed(2) + " m";
      }

      // 格式化面积显示
      function formatArea(sqMeters) {
        if (sqMeters >= 1000000) {
          return "面积: " + (sqMeters / 1000000).toFixed(2) + " km²";
        }
        return "面积: " + sqMeters.toFixed(2) + " m²";
      }

      // 计算多边形面积（使用球面几何）
      function calculatePolygonArea(latlngs) {
        if (latlngs.length < 3) return 0;
        let area = 0;
        const R = 6371000; // 地球半径（米）

        for (let i = 0; i < latlngs.length; i++) {
          const j = (i + 1) % latlngs.length;
          const p1 = latlngs[i];
          const p2 = latlngs[j];

          const lat1 = (p1.lat * Math.PI) / 180;
          const lat2 = (p2.lat * Math.PI) / 180;
          const lng1 = (p1.lng * Math.PI) / 180;
          const lng2 = (p2.lng * Math.PI) / 180;

          area += (lng2 - lng1) * (2 + Math.sin(lat1) + Math.sin(lat2));
        }

        area = (Math.abs(area) * R * R) / 2;
        return area;
      }

      // ========== 地图控件开关持久化 ==========
      (function () {
        var TOGGLE_PREFIX = "dupal_toggle_";

        // Geoman 选项
        var GEOMEN_OPTS = {
          position: "topright",
          drawCircleMarker: true,
          drawText: true,
          drawMarker: false,
          drawCircle: true,
          drawPolyline: true,
          drawPolygon: true,
          drawRectangle: false,
          editMode: false,
          dragMode: true,
          cutPolygon: false,
          rotateMode: false,
          removalMode: true,
        };

        // 开关配置：cbId → { storageKey, control?, enable?, disable? }
        var toggleConfig = {
          geomenToggle: {
            storageKey: TOGGLE_PREFIX + "geomen",
            enable: function () {
              map.pm.addControls(GEOMEN_OPTS);
            },
            disable: function () {
              map.pm.removeControls();
            },
          },
          mouseCoordToggle: {
            storageKey: TOGGLE_PREFIX + "mouseCoord",
            control: mousePosControl,
          },
          zoomToggle: {
            storageKey: TOGGLE_PREFIX + "zoom",
            control: map.zoomControl,
          },
          scaleToggle: {
            storageKey: TOGGLE_PREFIX + "scale",
            control: scaleControl,
          },
          layerCtrlToggle: {
            storageKey: TOGGLE_PREFIX + "layerCtrl",
            enable: function () {
              rebuildLayerCtrl();
            },
            disable: function () {
              if (window._layerCtrlControl) {
                map.removeControl(window._layerCtrlControl);
                window._layerCtrlControl = null;
              }
            },
          },
        };

        function initToggle(cbId, cfg) {
          var cb = document.getElementById(cbId);
          if (!cb) return;

          var saved = localStorage.getItem(cfg.storageKey);
          var defaultChecked = cb.checked; // 取 HTML 默认状态
          var checked = saved !== null ? saved === "true" : defaultChecked;
          cb.checked = checked;

          // 若上次保存为关闭，移除对应控件
          if (!checked) {
            if (cfg.disable) cfg.disable();
            else if (cfg.control) map.removeControl(cfg.control);
          }

          cb.addEventListener("change", function () {
            localStorage.setItem(cfg.storageKey, String(this.checked));
            if (this.checked) {
              if (cfg.enable) cfg.enable();
              else if (cfg.control) cfg.control.addTo(map);
            } else {
              if (cfg.disable) cfg.disable();
              else if (cfg.control) map.removeControl(cfg.control);
            }
          });
        }

        for (var cbId in toggleConfig) {
          if (toggleConfig.hasOwnProperty(cbId))
            initToggle(cbId, toggleConfig[cbId]);
        }

        // 折叠区 open/close 持久化
        var sectionEl = document.getElementById("toggleSection");
        if (sectionEl) {
          var secSaved = localStorage.getItem(TOGGLE_PREFIX + "sectionOpen");
          sectionEl.open = secSaved !== null ? secSaved === "true" : true;
          sectionEl.addEventListener("toggle", function () {
            localStorage.setItem(
              TOGGLE_PREFIX + "sectionOpen",
              String(this.open),
            );
          });
        }

        // 地图控制面板：点击面板其他区域自动折叠
        (function () {
          var sec = document.getElementById("toggleSection");
          var panel = document.querySelector(".layer-panel");
          if (sec && panel) {
            panel.addEventListener("click", function (e) {
              if (!sec.open) return;
              // 点击在 toggle-section 外部 → 折叠
              if (sec !== e.target && !sec.contains(e.target)) {
                sec.open = false;
              }
            });
          }
        })();
      })();

      // ========== 外部文件处理（支持 GeoJSON / SHP / KML / KMZ / ZIP → 统一走 addUserLayer）==========
      window.loadFileAsUserLayer = function loadFileAsUserLayer(
        file,
        autoShow,
      ) {
        var ext = (file.name.split(".").pop() || "").toLowerCase();

        // ========== 单文件：直接用原始文件名 ==========
        if (/^(geojson|json|kml)$/i.test(ext)) {
          if (/^kml$/i.test(ext) && typeof toGeoJSON === "undefined") {
            alert("toGeoJSON 库尚未加载，请检查网络连接后刷新页面。");
            return;
          }
          window.showLoading("正在读取文件...");
          var reader = new FileReader();
          reader.onload = function (ev) {
            window.showLoading("正在解析数据...");
            setTimeout(function () {
              try {
                var data;
                if (/^kml$/i.test(ext)) {
                  var parser = new DOMParser();
                  var xmlDoc = parser.parseFromString(
                    ev.target.result,
                    "text/xml",
                  );
                  data = toGeoJSON.kml(xmlDoc);
                } else {
                  data = JSON.parse(ev.target.result);
                }
                deliverToMap(data, file.name, autoShow);
              } catch (err) {
                window.hideLoading();
                alert(
                  ext.toUpperCase() +
                    " 解析失败：" +
                    file.name +
                    "\n" +
                    err.message,
                );
              }
            }, 50);
          };
          reader.onerror = function () {
            window.hideLoading();
            alert("文件读取失败：" + (file.name || ""));
          };
          reader.readAsText(file);
        } else if (/^(zip|kmz)$/i.test(ext)) {
          // ========== ZIP / KMZ：扫描内部文件 ==========
          if (typeof JSZip === "undefined") {
            alert("JSZip 库尚未加载，请检查网络连接后刷新页面。");
            return;
          }
          var isKmz = /^kmz$/i.test(ext);
          window.showLoading("正在读取 " + (isKmz ? "KMZ" : "ZIP") + "...");
          var readerZip = new FileReader();
          readerZip.onload = function (ev) {
            window.showLoading("正在解压...");
            var buffer = ev.target.result;
            setTimeout(function () {
              JSZip.loadAsync(buffer)
                .then(function (zip) {
                  var shpFileNames = []; // .shp 文件名（不含扩展名）
                  var geojsonFiles = [];
                  var kmlFiles = [];
                  var kmzFiles = [];

                  zip.forEach(function (relativePath, zipEntry) {
                    if (zipEntry.dir) return;
                    var name = relativePath.split("/").pop();
                    if (!name || name.startsWith(".")) return;

                    var e = name.split(".").pop().toLowerCase();
                    if (e === "shp") {
                      var baseName = name.replace(/\.shp$/i, "");
                      if (shpFileNames.indexOf(baseName) === -1) {
                        shpFileNames.push(baseName);
                      }
                    } else if (/^(geojson|json)$/i.test(e)) {
                      geojsonFiles.push({ path: relativePath, name: name });
                    } else if (/^kml$/i.test(e)) {
                      kmlFiles.push({ path: relativePath, name: name });
                    } else if (/^kmz$/i.test(e)) {
                      kmzFiles.push({ path: relativePath, name: name });
                    }
                  });

                  var tasks = [];

                  // 1) SHP：用 shpjs 解析，图层名用 .shp 自身文件名
                  if (shpFileNames.length > 0 && typeof shp === "function") {
                    tasks.push(
                      shp(buffer)
                        .then(function (result) {
                          if (Array.isArray(result)) {
                            var count = Math.min(
                              result.length,
                              shpFileNames.length,
                            );
                            for (var si = 0; si < count; si++) {
                              deliverToMap(
                                result[si],
                                shpFileNames[si] + ".shp",
                              );
                            }
                            for (var sj = count; sj < result.length; sj++) {
                              deliverToMap(
                                result[sj],
                                file.name.replace(/\.(zip|kmz)$/i, "") +
                                  "_" +
                                  sj +
                                  ".shp",
                              );
                            }
                          } else {
                            deliverToMap(
                              result,
                              (shpFileNames[0] ||
                                file.name.replace(/\.(zip|kmz)$/i, "")) +
                                ".shp",
                            );
                          }
                        })
                        .catch(function (err) {
                          console.warn("shpjs 解析失败:", err);
                        }),
                    );
                  }

                  // 2) ZIP 内 GeoJSON：用内部文件名
                  geojsonFiles.forEach(function (item) {
                    tasks.push(
                      zip
                        .file(item.path)
                        .async("text")
                        .then(function (text) {
                          var data = JSON.parse(text);
                          deliverToMap(data, item.name);
                        })
                        .catch(function (err) {
                          console.warn("GeoJSON 解析失败:", item.name, err);
                        }),
                    );
                  });

                  // 4) ZIP 内嵌套 KMZ：递归解压，取第一个 KML，用 KMZ 自身文件名
                  if (typeof toGeoJSON !== "undefined") {
                    kmzFiles.forEach(function (item) {
                      tasks.push(
                        zip
                          .file(item.path)
                          .async("arraybuffer")
                          .then(function (kmzBuf) {
                            return JSZip.loadAsync(kmzBuf).then(
                              function (innerZip) {
                                var innerKml = null;
                                innerZip.forEach(function (rp, entry) {
                                  if (
                                    !innerKml &&
                                    !entry.dir &&
                                    /^kml$/i.test(rp.split(".").pop())
                                  ) {
                                    innerKml = entry;
                                  }
                                });
                                if (!innerKml)
                                  throw new Error("KMZ 中未找到 KML 文件");
                                return innerKml.async("text");
                              },
                            );
                          })
                          .then(function (kmlText) {
                            var parser = new DOMParser();
                            var xmlDoc = parser.parseFromString(
                              kmlText,
                              "text/xml",
                            );
                            var fc = toGeoJSON.kml(xmlDoc);
                            deliverToMap(fc, item.name);
                          })
                          .catch(function (err) {
                            console.warn("嵌套 KMZ 解析失败:", item.name, err);
                          }),
                      );
                    });
                  }

                  // 5) ZIP 内 KML：KMZ 只取第一个（用外层文件名），通用 ZIP 用各自内部文件名
                  if (typeof toGeoJSON !== "undefined") {
                    var kmlList = isKmz
                      ? kmlFiles.length > 0
                        ? [kmlFiles[0]]
                        : []
                      : kmlFiles;
                    kmlList.forEach(function (item) {
                      var displayName = isKmz ? file.name : item.name;
                      tasks.push(
                        zip
                          .file(item.path)
                          .async("text")
                          .then(function (text) {
                            var parser = new DOMParser();
                            var xmlDoc = parser.parseFromString(
                              text,
                              "text/xml",
                            );
                            var fc = toGeoJSON.kml(xmlDoc);
                            deliverToMap(fc, displayName);
                          })
                          .catch(function (err) {
                            console.warn("KML 解析失败:", item.name, err);
                          }),
                      );
                    });
                  }

                  if (tasks.length === 0) {
                    window.hideLoading();
                    alert(
                      "ZIP 中未找到可识别的文件\n支持：.shp、.geojson、.json、.kml",
                    );
                    return;
                  }

                  Promise.allSettled(tasks).then(function () {
                    window.hideLoading();
                  });
                })
                .catch(function (err) {
                  window.hideLoading();
                  alert("ZIP 解压失败：" + file.name + "\n" + err.message);
                });
            }, 50);
          };
          readerZip.onerror = function () {
            window.hideLoading();
            alert("文件读取失败：" + (file.name || ""));
          };
          readerZip.readAsArrayBuffer(file);
        } else {
          alert(
            "不支持的文件格式：." +
              ext +
              "\n支持格式：GeoJSON、JSON、KML、KMZ、ZIP",
          );
        }
      };

      // 统一交付给地图图层
      function deliverToMap(data, fileName, autoShow) {
        if (typeof window.addUserLayer === "function") {
          window.addUserLayer(data, fileName, autoShow);
          var layerPanel = document.getElementById("layerPanel");
          if (layerPanel) layerPanel.classList.add("active");
        }
        window.hideLoading();
      }

      // 暂存：geojsonloader.js 尚未就绪时收到的文件
      var _pendingFiles = [];

      // File Handling API：PWA 关联打开文件
      if ("launchQueue" in window) {
        launchQueue.setConsumer(function (launchParams) {
          launchParams.files.forEach(function (fileHandle) {
            fileHandle
              .getFile()
              .then(function (file) {
                if (typeof window.addUserLayer === "function") {
                  loadFileAsUserLayer(file);
                } else {
                  // geojsonloader 还未就绪，先暂存
                  _pendingFiles.push(file);
                }
              })
              .catch(function (err) {
                console.error("读取文件失败：", err);
              });
          });
        });
      }

      // 拖放支持：拖入地图页面（支持单文件和文件夹）
      document.addEventListener("dragover", function (e) {
        e.preventDefault();
        e.stopPropagation();
      });
      document.addEventListener("drop", function (e) {
        e.preventDefault();
        e.stopPropagation();

        var items = e.dataTransfer.items;
        if (!items || !items.length) return;

        // 检测是否有目录条目
        var hasDirectory = false;
        for (var i = 0; i < items.length; i++) {
          var entry = items[i].webkitGetAsEntry && items[i].webkitGetAsEntry();
          if (entry && entry.isDirectory) {
            hasDirectory = true;
            break;
          }
        }

        if (hasDirectory) {
          // 文件夹拖入：递归扫描所有文件，统一走文件夹上传逻辑
          var allFiles = [];
          var pendingEntries = [];

          for (var di = 0; di < items.length; di++) {
            var dirEntry =
              items[di].webkitGetAsEntry && items[di].webkitGetAsEntry();
            if (dirEntry) pendingEntries.push(dirEntry);
          }

          function readEntriesRecursive() {
            if (!pendingEntries.length) {
              onAllFilesCollected(allFiles);
              return;
            }
            var current = pendingEntries.shift();
            if (current.isFile) {
              current.file(
                function (file) {
                  allFiles.push(file);
                  readEntriesRecursive();
                },
                function () {
                  readEntriesRecursive(); // 读取失败跳过
                },
              );
            } else if (current.isDirectory) {
              var reader = current.createReader();
              reader.readEntries(
                function (entries) {
                  for (var ei = 0; ei < entries.length; ei++) {
                    pendingEntries.push(entries[ei]);
                  }
                  readEntriesRecursive();
                },
                function () {
                  readEntriesRecursive(); // 读取失败跳过
                },
              );
            } else {
              readEntriesRecursive();
            }
          }

          function onAllFilesCollected(files) {
            if (!files.length) return;
            // 复用 handleFolderUpload 的逻辑
            window.showLoading("正在扫描文件夹...");

            var fileMap = {};
            files.forEach(function (file) {
              fileMap[file.name.toLowerCase()] = file;
            });

            var nonShpExts = ["kml", "kmz", "json", "geojson"];
            var nonShpFiles = [];
            files.forEach(function (file) {
              var ext = file.name.split(".").pop().toLowerCase();
              if (nonShpExts.indexOf(ext) !== -1) nonShpFiles.push(file);
            });

            var shpFileNames = [];
            files.forEach(function (file) {
              if (file.name.toLowerCase().endsWith(".shp")) {
                var baseName = file.name.replace(/\.shp$/i, "");
                if (shpFileNames.indexOf(baseName) === -1) {
                  shpFileNames.push(baseName);
                }
              }
            });

            if (!nonShpFiles.length && !shpFileNames.length) {
              window.hideLoading();
              alert(
                "文件夹中未找到支持的矢量文件\n支持：shp、kml、kmz、json、geojson",
              );
              return;
            }

            var warnings = [];
            var shpTasks = [];

            nonShpFiles.forEach(function (file) {
              loadFileAsUserLayer(file, false);
            });

            if (!shpFileNames.length) {
              window.hideLoading();
              // 确保左侧面板打开
              var layerPanel = document.getElementById("layerPanel");
              if (layerPanel) layerPanel.classList.add("active");
              return;
            }

            if (typeof JSZip !== "undefined") {
              shpFileNames.forEach(function (baseName) {
                var companionExts = [".dbf", ".shx", ".prj"];
                var companions = [];
                var missing = [];
                companionExts.forEach(function (ce) {
                  var found = null;
                  var keyLower = (baseName + ce).toLowerCase();
                  for (var fname in fileMap) {
                    if (fname === keyLower || fname.endsWith("/" + keyLower)) {
                      found = fileMap[fname];
                      break;
                    }
                  }
                  if (found) {
                    companions.push({ name: baseName + ce, file: found });
                  } else {
                    missing.push(ce);
                  }
                });
                if (missing.length > 0) {
                  warnings.push(
                    baseName + ".shp 缺少配套文件：" + missing.join("、"),
                  );
                }

                var shpFile = null;
                var shpKeyLower = (baseName + ".shp").toLowerCase();
                for (var fn in fileMap) {
                  if (fn === shpKeyLower || fn.endsWith("/" + shpKeyLower)) {
                    shpFile = fileMap[fn];
                    break;
                  }
                }
                if (!shpFile) return;

                var allParts = companions.concat([
                  { name: baseName + ".shp", file: shpFile },
                ]);
                var readPromises = allParts.map(function (part) {
                  return new Promise(function (resolve) {
                    var reader = new FileReader();
                    reader.onload = function (ev) {
                      resolve({ name: part.name, buffer: ev.target.result });
                    };
                    reader.onerror = function () {
                      resolve(null);
                    };
                    reader.readAsArrayBuffer(part.file);
                  });
                });
                shpTasks.push(
                  Promise.all(readPromises).then(function (results) {
                    var zip = new JSZip();
                    results.forEach(function (r) {
                      if (r && r.buffer) zip.file(r.name, r.buffer);
                    });
                    return zip.generateAsync({ type: "arraybuffer" });
                  }),
                );
              });

              Promise.allSettled(shpTasks).then(function (results) {
                var shpLoadPromises = [];
                results.forEach(function (result, idx) {
                  if (
                    result.status === "fulfilled" &&
                    typeof shp === "function"
                  ) {
                    shpLoadPromises.push(
                      shp(result.value)
                        .then(function (geojson) {
                          var name = shpFileNames[idx] + ".shp";
                          if (Array.isArray(geojson)) {
                            geojson.forEach(function (layer, li) {
                              var layerName =
                                geojson.length === 1
                                  ? name
                                  : name.replace(/\.shp$/i, "") +
                                    "_" +
                                    li +
                                    ".shp";
                              window.addUserLayer(layer, layerName, false);
                            });
                          } else {
                            window.addUserLayer(geojson, name, false);
                          }
                        })
                        .catch(function (err) {
                          warnings.push(
                            shpFileNames[idx] +
                              ".shp 解析失败：" +
                              (err.message || err),
                          );
                        }),
                    );
                  }
                });
                Promise.allSettled(shpLoadPromises).then(function () {
                  window.hideLoading();
                  var layerPanel = document.getElementById("layerPanel");
                  if (layerPanel) layerPanel.classList.add("active");
                  if (warnings.length > 0) {
                    alert("SHP 加载提示：\n\n" + warnings.join("\n\n"));
                  }
                });
              });
            } else {
              window.hideLoading();
              alert(
                "JSZip 库尚未加载，无法解析 SHP 文件\n请检查网络连接后刷新页面。",
              );
            }
          }

          readEntriesRecursive();
        } else {
          // 单文件拖入：走原有逻辑
          Array.from(e.dataTransfer.files).forEach(function (file) {
            if (/\.(geojson|json|zip|kml|kmz)$/i.test(file.name)) {
              loadFileAsUserLayer(file);
              var layerPanel = document.getElementById("layerPanel");
              if (layerPanel) layerPanel.classList.add("active");
            }
          });
        }
      });
    </script>
    <!-- 文件加载缓冲示意 -->
    <div id="loadingOverlay">
      <div class="loading-spinner"></div>
      <div id="loadingMessage"></div>
    </div>
    <script>
      window.showLoading = function (msg) {
        var el = document.getElementById("loadingOverlay");
        var msgEl = document.getElementById("loadingMessage");
        if (el) el.classList.add("active");
        if (msgEl) msgEl.textContent = msg || "加载中...";
      };
      window.hideLoading = function () {
        var el = document.getElementById("loadingOverlay");
        if (el) el.classList.remove("active");
      };
    </script>
    <!-- geojson图层加载器 -->
    <script src="./assets/geojsonloader.js"></script>
    <!-- 投点功能（独立模块） -->
    <script src="./assets/pointdrop.js"></script>
    <script src="./assets/marked.min.js"></script>
    <script src="./assets/dialog.js"></script>
    <script>
      // 悬浮窗：popup 打开时插入右下角缩放按钮
      map.on("popupopen", function (e) {
        var popup = e.popup;
        var el = popup.getElement();
        if (!el) return;
        if (el.querySelector(".popup-zoom-btn")) return;

        // 从 popup 关联的图层/要素中提取 bounds 或坐标
        var layer = popup._source || popup._sourceLayer;
        var bounds = null;
        var latLng = null;

        if (layer && typeof layer.getBounds === "function") {
          try {
            var b = layer.getBounds();
            if (b && b.isValid()) bounds = b;
          } catch (ex) {}
        }
        if (!bounds && layer && layer.getLatLng) {
          latLng = layer.getLatLng();
        }
        if (!bounds && !latLng) {
          // 尝试从 popup 自身获取
          var pLatLng = popup.getLatLng ? popup.getLatLng() : null;
          if (pLatLng) latLng = pLatLng;
        }
        if (!bounds && !latLng) return;

        var btn = document.createElement("button");
        btn.className = "popup-zoom-btn";
        btn.title = "缩放至要素";
        btn.innerHTML = "⚲";

        btn.onclick = function (ev) {
          L.DomEvent.stop(ev);
          if (bounds) {
            map.fitBounds(bounds, { maxZoom: 16, padding: [40, 40] });
          } else if (latLng) {
            map.setView([latLng.lat, latLng.lng], Math.max(map.getZoom(), 8));
          }
          map.closePopup();
        };

        el.appendChild(btn);
      });
    </script>
  </body>
