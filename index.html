<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>海底地质一张图</title>
    <!-- Leaflet核心库 -->
    <script src="./assets/leaflet.js"></script>
    <!-- Esri Leaflet 插件（ArcGIS MapServer 矢量加载） -->
    <script src="./assets/esri-leaflet.js"></script>
    <link rel="stylesheet" href="./assets/leaflet.css" />
    <!-- 纯函数工具（无外部依赖） -->
    <script src="./assets/geo-utils.js"></script>
    <!-- Leaflet 插件：GeoMarker 图标工厂 -->
    <script src="./assets/Leaflet.GeoMarker.js"></script>
    <!-- Leaflet 插件：GZ 加载器 + IDB 缓存 -->
    <script src="./assets/Leaflet.GzIdbLoader.js"></script>
    <!-- 显示坐标插件 -->
    <link rel="stylesheet" href="./assets/Leaflet.MousePosition.css" />
    <script src="./assets/Leaflet.MousePosition.js"></script>
    <!-- 图例控件插件 -->
    <link rel="stylesheet" href="./assets/Leaflet.LegendControl.css" />
    <script src="./assets/Leaflet.LegendControl.js"></script>
    <!-- GeoJSON Loader 样式 -->
    <link rel="stylesheet" href="./assets/geojsonloader.css" />
    <!-- 高程读取插件样式 -->
    <link rel="stylesheet" href="./assets/elevation-query.css" />
    <!-- Leaflet-Geoman 测量插件 -->
    <link rel="stylesheet" href="./assets/leaflet-geoman.css" />
    <script src="./assets/leaflet-geoman.js"></script>
    <!-- Leaflet点聚类插件（≤10K 点回退方案） -->
    <link rel="stylesheet" href="./assets/leaflet.markercluster.css" />
    <link rel="stylesheet" href="./assets/leaflet.markercluster.default.css" />
    <script src="./assets/leaflet.markercluster.js"></script>
    <!-- RBush 空间索引（Canvas 聚类依赖） -->
    <script src="./assets/rbush.js"></script>
    <!-- Canvas 聚类渲染（>10K 点零 DOM 方案） -->
    <script src="./assets/Leaflet.MarkersCanvas.js"></script>
    <script src="./assets/html-to-image.min.js"></script>
    <!-- 格式转换库：shp/kml/kmz → GeoJSON -->
    <script src="./assets/shp.min.js"></script>
    <script src="./assets/togeojson.min.js"></script>
    <script src="./assets/jszip.min.js"></script>
    <!-- 弹窗组件（尽早加载，供全局使用） -->
    <link rel="stylesheet" href="./assets/dialog.css" />
    <script src="./assets/dialog.js"></script>
    <!-- DEM 高程渲染 -->
    <script src="./assets/georaster.min.js"></script>
    <script src="./assets/geoblaze.min.js"></script>
    <script src="./assets/georaster-layer-for-leaflet.min.js"></script>
    <!-- 图层配置数据（需在 geojsonloader 之前加载） -->
    <script src="./assets/geo-config.js"></script>
    <!-- 自定义css -->
    <link rel="stylesheet" href="./assets/main.css" />
    <!-- 投点编辑器样式 -->
    <link rel="stylesheet" href="./assets/pointdrop.css" />

    <!-- WPA -->
    <link rel="manifest" href="./manifest.json" />
    <script>
      // 尽早捕获 PWA 安装提示事件（供 Leaflet.MousePosition 插件使用）
      window._pwaInstallPrompt = null;
      window.addEventListener("beforeinstallprompt", function (e) {
        // 不拦截，让浏览器也可以自动弹窗；同时记录事件供自定义按钮使用
        window._pwaInstallPrompt = e;
      });

      // 检查浏览器是否支持Service Worker（注册已移至 assets/app.js）
    </script>
    <!-- 适配iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Dupal" />
    <!-- iOS 主屏幕图标（优先SVG，降级用PNG） -->
    <link
      rel="apple-touch-icon"
      href="./assets/images/icon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      sizes="152x152"
      href="./assets/images/icon/ios/152.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="167x167"
      href="./assets/images/icon/ios/167.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="./assets/images/icon/ios/180.png"
    />
    <!-- Windows 瓷砖配置 -->
    <meta name="msapplication-config" content="./browserconfig.xml" />
    <!-- 主题色适配：日间默认值，深色模式由 app.js 动态更新 -->
    <meta id="themeColorMeta" name="theme-color" content="#99cc99" />

    <meta

      content="#111111"
      media="(prefers-color-scheme: dark)"
    />

  <body>
    <!-- 侧边栏开关（隐藏checkbox） -->
    <input
      type="checkbox"
      id="sidebarToggle"
      class="sidebar-toggle-input"
      hidden
    />
    <!-- 悬浮触发按钮 -->
    <label
      class="layer-trigger"
      id="layerTrigger"
      for="sidebarToggle"
      tabindex="0"
      >要素加载</label
    >
    <!-- 点击外部关闭的遮罩 -->
    <label class="sidebar-backdrop" for="sidebarToggle"></label>
    <!-- 左侧图层控制面板 -->
    <div class="layer-panel" id="layerPanel">
      <h3 id="panelTitle" class="panel-title">
        <span>OGV-海洋地质一张图</span>
        <span class="title-right">
          <span
            class="help-icon help-icon-lg"
            id="aboutLink"
            tabindex="0"
            role="button"
            data-dialog="README.md"
            data-dialog-title="关于本站"
            title="关于本站"
            >?</span
          >
          <button class="sidebar-pin-btn" id="pinBtn" title="钉住侧边栏">
            📌
          </button>
        </span>
      </h3>
      <div class="panel-resize-handle" id="panelResizeHandle"></div>
      <div class="panel-scroll" id="panelScroll">
        <!-- 搜索框 -->
        <div class="search-bar panel-module" id="searchBar">
          <input
            type="text"
            id="searchInput"
            placeholder="🔍 搜索站位..."
            autocomplete="off"
          />
          <span class="search-clear" id="searchClear" title="清空搜索">❌</span>
          <div class="search-results" id="searchResults"></div>
        </div>
        <!-- 地图设置（由标题行 ⚙️ 按钮控制） -->
        <details
          class="toggle-section panel-module"
          id="toggleSection"
          data-persist-details
        >
          <summary>⚙️ 地图设置</summary>
          <div class="toggle-body" id="toggleBody"></div>
        </details>
        <!-- 静态矢量要素图层组 -->
        <details
          class="layer-section panel-module"
          id="dataLayerSection"
          open
          data-persist-details
        >
          <summary id="dataLayerSummary">
            <span class="layer-group-arrow">▶</span>
            <span class="summary-title">📑 静态矢量要素</span>
            <span
              class="help-icon"
              id="dataHelpIcon"
              tabindex="0"
              role="button"
              data-dialog="docs/static-vector-help.md"
              data-dialog-title="📑 静态矢量要素 — 帮助"
              title="查看使用说明及数据来源"
              >?</span
            >
            <input
              type="checkbox"
              class="group-select-all"
              id="selectAllLayers"

          </summary>
          <div class="layer-section-content" id="dataLayerContent"></div>
        </details>
        <!-- 本地图层查看组 -->
        <details
          class="layer-section panel-module"
          id="userLayerSection"
          open
          data-persist-details
        >
          <summary id="userLayerSummary">
            <span class="layer-group-arrow">▶</span>
            <span class="summary-title">🗺️ 本地图层查看</span>
            <span
              class="help-icon"
              id="localHelpIcon"
              tabindex="0"
              role="button"
              data-dialog="docs/local-layer-help.md"
              data-dialog-title="🗺️ 本地图层查看 — 帮助"
              title="查看本地图层使用说明"
              >?</span
            >
            <input
              type="checkbox"
              class="group-select-all"
              id="selectAllLocalLayers"
              title="全选/全不选所有本地图层"
            />
          </summary>
          <div class="layer-section-content" id="userLayerContent">
            <div class="local-hint">
              数据仅在本机解析加载，不会上传至任何服务器
            </div>
            <div id="userLayerGroup">
              <div id="userLayerHint" class="empty-hint">
                还没有本地图层载入<br /><span class="empty-hint-sub"
                  >💡 可拖拽文件/文件夹到页面中直接加载</span
                >
              </div>
            </div>
            <div class="upload-area" id="uploadArea">
              <div id="pointDropAnchor"></div>
              <div class="upload-btn-row">
                <button class="upload-btn" id="uploadBtn">
                  📄 上传矢量（单文件）
                </button>
                <input
                  type="file"
                  id="fileInput"
                  class="file-input-hidden"
                  multiple
                  accept=".geojson,.json,.shp,.zip,.kml,application/vnd.google-earth.kml+xml,.kmz,application/vnd.google-earth.kmz,.gz,application/gzip"
                />
                <button class="folder-btn" id="folderBtn">📁 选择文件夹</button>
                <input
                  type="file"
                  id="folderInput"
                  class="file-input-hidden"
                  webkitdirectory
                  multiple
                />
              </div>
            </div>
          </div>
        </details>
        <!-- DEM 高程图层控制 -->
        <details
          class="toggle-section panel-module"
          id="demSection"
          data-persist-details
        >
          <summary>🏔️ DEM高程渲染（实验中）</summary>
          <div class="dem-controls">
            <div class="dem-upload-row">
              <label class="dem-upload-btn" for="demFileInput"
                >📂 加载 GeoTIFF</label
              >
              <input
                type="file"
                id="demFileInput"
                accept=".tif,.tiff"
                style="display: none"
              />
              <button
                class="dem-remove-btn"
                id="demRemoveBtn"
                title="移除DEM图层"
                style="display: none"
              >
                ✕
              </button>
            </div>
            <div
              class="dem-colormode-row"
              id="demColorModeRow"
              style="display: none"
            >
              <label>色带</label>
              <select id="demColorMode">
                <option value="bathymetry">海底地形</option>
                <option value="stretch">自适应拉伸</option>
                <option value="equalize">直方图均衡</option>
                <option value="grayscale">灰度</option>
              </select>
            </div>
            <div
              class="dem-opacity-row"
              id="demOpacityRow"
              style="display: none"
            >
              <label>透明度</label>
              <input
                type="range"
                id="demOpacitySlider"
                min="0"
                max="100"
                value="80"
              />
              <span id="demOpacityValue">80%</span>
            </div>
            <div class="dem-status" id="demStatus"></div>
          </div>
        </details>
      </div>
      <div id="appVersion" class="app-version"></div>
    </div>
    <!-- 右侧地图容器 -->
    <div id="map"></div>
    <!-- 备案号（合规要求：底部可见，链接跳转工信部、公安） -->
    <div id="beianBar">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"
        >蜀ICP备2025119436号-2</a
      >
      &nbsp;
      <a
        href="https://beian.mps.gov.cn/#/query/webSearch?code=33030402001567"
        rel="noreferrer"
        target="_blank"
        ><img
          src="./assets/images/备案编号图标.png"
          style="vertical-align: -2px; height: 1em; margin-right: 3px"
        />浙公网安备33030402001567号</a
      >
    </div>
    <!-- 基础设定JS脚本 -->
    <script>
      // 天地图TK配置
      const TDT_TK = "13f1ff3b1c59a59cea87cf63950b4888";
      window.TDT_TK = TDT_TK;

      // L.CRS.EPSG3857.projection.MAX_LATITUDE = 89;

      // 初始化地图容器
      map = L.map("map", {
        maxZoom: 19,
        zoomControl: true,
        attributionControl: false,
      }).setView([32, 107], 3);

      // ========== 底图图层定义 ==========
      // 0. 天地图全球境界底图
      const tdtIboLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=ibo_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxZoom: 18, crossOrigin: "anonymous" },
      );
      // 1. 天地图影像底图
      const tdtImgLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=img_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          minNativeZoom: 1,
          maxNativeZoom: 18,
          maxZoom: 22,
          crossOrigin: "anonymous",
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图影像</a>",
        },
      );
      const imgLayers = L.layerGroup([tdtImgLayer]);
      // 2. 天地图矢量底图
      const tdtVecLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=vec_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          minNativeZoom: 1,
          maxNativeZoom: 18,
          maxZoom: 22,
          crossOrigin: "anonymous",
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图矢量</a>",
        },
      );
      const vecLayers = L.layerGroup([tdtVecLayer]);

      // 2.1 天地图地形底图
      const tdtTerLayer = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=ter_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        {
          minNativeZoom: 1,
          maxNativeZoom: 18,
          maxZoom: 22,
          crossOrigin: "anonymous",
          attribution:
            "<a href='https://www.tianditu.gov.cn/' target='_blank'>天地图地形</a>",
        },
      );
      const terLayers = L.layerGroup([tdtTerLayer]);

      // 天地图地名标注（独立叠加层，供多选图层使用）
      const tdtAnnoOverlay = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cva_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxNativeZoom: 18, maxZoom: 22, crossOrigin: "anonymous" },
      );
      // 天地图影像标注 / 地形标注（更多底图中可切换对比）
      const tdtImgAnno = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cia_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxNativeZoom: 18, maxZoom: 22, crossOrigin: "anonymous" },
      );
      const tdtTerAnno = L.tileLayer(
        `https://t0.tianditu.gov.cn/DataServer?T=cta_w&x={x}&y={y}&l={z}&tk=${TDT_TK}`,
        { maxNativeZoom: 18, maxZoom: 22, crossOrigin: "anonymous" },
      );

      // 3. ArcGIS影像底图
      const ARCGIS_SERVICE_PREFIX =
        "https://server.arcgisonline.com/ArcGIS/rest/services/";

      function createArcGISBaseLayer(config, boundaryLayer = null) {
        // 拼接完整的服务地址（公共前缀 + 服务名称 + /MapServer）
        const getFullServiceUrl = (serviceName) =>
          `${ARCGIS_SERVICE_PREFIX}${serviceName}/MapServer`;

        // 1. 创建基础瓦片图层
        const baseLayer = L.tileLayer(
          `${getFullServiceUrl(config.serviceName)}/tile/{z}/{y}/{x}`,
          {
            maxNativeZoom: config.maxNativeZoom || 19,
            maxZoom: config.maxZoom || 22,
            crossOrigin: "anonymous",
            attribution: `<a href='https://www.arcgis.com/' target='_blank'>ArcGIS Online ${config.name}</a>`,
          },
        );

        // 2. 若有标注图层，一起组合
        let layersToGroup = [baseLayer];
        if (config.labelServiceName) {
          const labelLayer = L.tileLayer(
            `${getFullServiceUrl(config.labelServiceName)}/tile/{z}/{y}/{x}`,
            {
              maxNativeZoom: config.maxNativeZoom || 19,
              maxZoom: config.maxZoom || 22,
              crossOrigin: "anonymous",
            },
          );
          layersToGroup.push(labelLayer);
        }

        // 3. 叠加境界图层（如果传入）
        if (boundaryLayer) {
          layersToGroup.push(boundaryLayer);
        }

        // 4. 创建图层组并返回
        return {
          layerName: config.name,
          layer: L.layerGroup(layersToGroup),
        };
      }

      // ========== 3. ArcGIS 底图配置 ==========
      /**
       * 创建 ArcGIS 官方瓦片底图图层
       * @param {Object} config - 底图配置项
       * @param {string} config.name - 底图名称（用于控件显示）
       * @param {string} config.serviceName - ArcGIS 服务名称（拼接前缀后得到完整地址）
       * @param {number} config.maxNativeZoom - 瓦片服务实际最大缩放层级（超过此层级用放大填充）
       * @param {number} config.maxZoom - 地图允许的最大缩放层级（可超过 maxNativeZoom）
       * @param {Layer} boundaryLayer - 可选，叠加的境界图层（如 tdtIboLayer）
       * @param {string} config.labelServiceName - 可选，标注图层的服务名称
       * @returns {Object} { layerName: 图层名称, layer: 组合后的图层组 }
       */
      const arcgisBaseLayerConfigs = [
        // 影像底图
        {
          name: "ArcGIS-影像",
          serviceName: "World_Imagery",
          maxNativeZoom: 19,
          maxZoom: 22,
        },
        // 街道底图
        {
          name: "ArcGIS-街道",
          serviceName: "World_Street_Map",
          maxNativeZoom: 19,
          maxZoom: 22,
        },
        // 海洋底图
        {
          name: "ArcGIS-海洋",
          serviceName: "Ocean/World_Ocean_Base",
          labelServiceName: "Ocean/World_Ocean_Reference",
          maxNativeZoom: 10,
          maxZoom: 19,
        },
        // 物理地图
        {
          name: "ArcGIS-物理地图",
          serviceName: "World_Physical_Map",
          maxNativeZoom: 19,
          maxZoom: 22,
        },
        // 阴影地形图
        {
          name: "ArcGIS-山体阴影地形图",
          serviceName: "World_Shaded_Relief",
          maxNativeZoom: 13,
          maxZoom: 22,
        },
        // 世界地形底图
        {
          name: "ArcGIS-世界地形",
          serviceName: "World_Terrain_Base",
          maxNativeZoom: 19,
          maxZoom: 22,
        },
        // 地形底图
        {
          name: "ArcGIS-地形",
          serviceName: "World_Topo_Map",
          maxNativeZoom: 19,
          maxZoom: 22,
        },
      ];

      // ========== 4. 批量创建所有 ArcGIS 底图图层 ==========
      const arcgisBaseLayers = {};
      arcgisBaseLayerConfigs.forEach((config) => {
        const result = createArcGISBaseLayer(config, tdtIboLayer);
        arcgisBaseLayers[result.layerName] = result.layer;
      });

      // 打底的 ArcGIS 影像（不是可切换的底图，仅用于 ETOPO 等高线叠加）
      const arcgisLayers = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxNativeZoom: 19, maxZoom: 22, crossOrigin: "anonymous" },
      );

      // 4. OSM底图
      const osmLayer = L.tileLayer(
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxNativeZoom: 19,
          maxZoom: 22,
          crossOrigin: "anonymous",
          attribution:
            "<a href='https://www.openstreetmap.org/' target='_blank'>OpenStreetMap</a>",
        },
      );
      const osmLayers = L.layerGroup([osmLayer, tdtIboLayer]);

      // 5. ETOPO 2022 全球底图（支持跨180°三副本）
      // 辅助函数：为图像底图创建三份副本，分别偏移 -360°/0°/+360°，实现跨180°无缝显示
      function createWorldCopyImageOverlay(url, bounds, options) {
        var south = bounds[0][0];
        var west = bounds[0][1];
        var north = bounds[1][0];
        var east = bounds[1][1];
        return L.layerGroup([
          L.imageOverlay(
            url,
            [
              [south, west - 360],
              [north, east - 360],
            ],
            options,
          ),
          L.imageOverlay(
            url,
            [
              [south, west],
              [north, east],
            ],
            options,
          ),
          L.imageOverlay(
            url,
            [
              [south, west + 360],
              [north, east + 360],
            ],
            options,
          ),
        ]);
      }

      var etopoBounds = [
        [-85.06, -180],
        [85.06, 180],
      ];
      const etopoLayer = createWorldCopyImageOverlay(
        "./assets/xyz/etopo.jpg",
        etopoBounds,
        {
          attribution:
            '<a href="https://www.ngdc.noaa.gov/" target="_blank">ETOPO 2022</a>',
        },
      );
      const etopohighLayer = createWorldCopyImageOverlay(
        "./assets/xyz/etopo2022high.jpg",
        etopoBounds,
        {
          attribution:
            '<a href="https://www.ngdc.noaa.gov/" target="_blank">ETOPO 2022 HD</a>',
        },
      );

      // ========== 6. GEBCO 全球水深 WMS ==========
      const gebcoShadedLayer = L.tileLayer.wms(
        "https://wms.gebco.net/mapserv?",
        {
          layers: "GEBCO_LATEST",
          format: "image/png",
          transparent: true,
          version: "1.1.1",
          maxZoom: 12,
          crossOrigin: "anonymous",
          attribution:
            '<a href="https://www.gebco.net/" target="_blank">GEBCO</a>',
        },
      );
      const gebcoFlatLayer = L.tileLayer.wms("https://wms.gebco.net/mapserv?", {
        layers: "GEBCO_LATEST_2",
        format: "image/png",
        transparent: true,
        version: "1.1.1",
        maxZoom: 12,
        crossOrigin: "anonymous",

      // ========== 控件配置 ==========
      // 所有底图统一放在 allBaseLayers 对象中（单一数据源，避免与 L.control 定义不同步）

      // 水深/地质底图

      // GEBCO 2024(latest) 额外图层
      allBaseLayers["GEBCO2024-含冰下地形浮雕"] = gebcoSubIceLayer;
      allBaseLayers["GEBCO2024-平面着色(含冰下)"] = gebcoFlatSubIceLayer;

      // GEBCO 2025 网格（最新发布）
      allBaseLayers["GEBCO2025-水深地形"] = gebco2025ShadedLayer;
      allBaseLayers["GEBCO2025-水深平面"] = gebco2025FlatLayer;

      allBaseLayers["OpenStreetMap"] = osmLayers;

      // 所有覆盖层统一存放（永远可见的 + 更多底图模式才显示的）
      const allOverlays = {

      // 全球海岛（ArcGIS UNEP-WCMC）FeatureLayer 工厂函数
      function createIslandLayer(layerId, displayName, defaultOpacity) {
        var ly = L.esri.featureLayer({
          url:
            "https://data-gis.unep-wcmc.org/server/rest/services/Global_Islands/MapServer/" +
            layerId,
          style: function () {
            return {
              color: "#3388ff",
              weight: 1,
              opacity: 0.8,
              fillOpacity: 0.25,
            };
          },
        });
        ly.bindPopup(function (layer) {
          try {
            if (
              window.GeoUtils &&
              typeof window.GeoUtils.buildPopupContent === "function"
            )
              return window.GeoUtils.buildPopupContent(
                layer.feature,
                displayName,
                null,
                displayName,
              );
          } catch (e) {}
          // 兜底弹窗：属性表
          var props = layer.feature && layer.feature.properties;
          if (!props) return "";
          var html =
            '<div class="geo-popup-content" style="font-size:13px;line-height:1.6;max-height:300px;overflow-y:auto;">';
          html +=
            '<div class="feature-popup-title" style="font-weight:bold;font-size:14px;margin-bottom:6px;border-bottom:1px solid #ddd;padding-bottom:4px;">' +
            displayName +
            "</div>";
          html += '<table style="width:100%;border-collapse:collapse;">';
          for (var k in props) {
            if (props[k] == null || props[k] === "") continue;
            html +=
              '<tr><td style="padding:2px 6px;color:#666;white-space:nowrap;vertical-align:top;">' +
              k +
              "</td>" +
              '<td style="padding:2px 6px;">' +
              props[k] +
              "</td></tr>";
          }
          html += "</table></div>";
          return html;
        });
        ly.on("load", function () {
          console.log("[island] ✅ " + displayName + " 加载完成");
        });
        ly.on("error", function (err) {
          console.error("[island] ❌ " + displayName + " 加载出错:", err);
        });
        return ly;
      }

      var island_0_verysmall = createIslandLayer(0, "UNEP-WCMC超小海岛");
      var island_1_small = createIslandLayer(1, "UNEP-WCMC小海岛");
      var island_2_big = createIslandLayer(2, "UNEP-WCMC大海岛");
      var island_3_continents = createIslandLayer(3, "UNEP-WCMC大陆");

      const moreOverlays = {
        // 仅在"更多底图"开启时出现
        天地图影像标注: tdtImgAnno,
        天地图地形标注: tdtTerAnno,
        // UNEP-WCMC 全球岛屿（Esri featureLayer，矢量视口按需加载）
        "UNEP-WCMC超小海岛": island_0_verysmall,
        "UNEP-WCMC小海岛": island_1_small,
        "UNEP-WCMC大海岛": island_2_big,
        "UNEP-WCMC大陆": island_3_continents,
      };

      // 获取当前可见覆盖层集合
      function getVisibleOverlays() {
        var cb = document.getElementById("moreBasemapToggle");
        if (cb && cb.checked) {
          var merged = {};
          for (var k in allOverlays) merged[k] = allOverlays[k];
          for (var k in moreOverlays) merged[k] = moreOverlays[k];
          return merged;
        }
        return allOverlays;
      }

      // ========== "更多底图"开关：控制 ArcGIS 扩展底图的显示 ==========
      // 默认显示的底图子集（关闭"更多底图"时）
      function getDefaultBaseLayers() {
        var layers = {};
        var keys = [
          "ETOPO",
          "ETOPO_2022",
          "天地图影像",
          "天地图矢量",
          "天地图地形",
          "ArcGIS-影像",
          "ArcGIS-海洋",
          "GEBCO2025-水深地形",
          "OpenStreetMap",
        ];
        keys.forEach(function (k) {
          if (allBaseLayers[k]) layers[k] = allBaseLayers[k];
        });
        return layers;
      }

      // 获取当前可见底图集合
      function getVisibleBaseLayers() {
        var cb = document.getElementById("moreBasemapToggle");
        if (cb && cb.checked) return allBaseLayers;
        return getDefaultBaseLayers();
      }

      // 当前选中的底图名称（默认 ArcGIS-海洋，原始默认）
      var _currentBasemapName = "ArcGIS-海洋";

      // 重建底图控件
      function rebuildLayerCtrl() {
        if (window._layerCtrlControl) {
          map.removeControl(window._layerCtrlControl);
        }
        var visibleLayers = getVisibleBaseLayers();

        // 确保当前底图在地图上且属于可见集合
        var currentLayer = allBaseLayers[_currentBasemapName];
        if (currentLayer && !map.hasLayer(currentLayer)) {
          // 移除所有其他底图
          for (var key in allBaseLayers) {
            if (map.hasLayer(allBaseLayers[key])) {
              map.removeLayer(allBaseLayers[key]);
            }
          }
          map.addLayer(currentLayer);
        } else if (!currentLayer) {
          // 兜底
          var fallback = allBaseLayers["ArcGIS-海洋"] || allBaseLayers["ETOPO"];
          if (fallback) map.addLayer(fallback);
        }

        window._layerCtrlControl = L.control
          .layers(visibleLayers, getVisibleOverlays(), {
            position: "bottomright",
            collapsed: true,
            autoZIndex: true,
          })
          .addTo(map);

        // 清理不在可见集合中的覆盖层（如切换"更多底图"关闭时）
        var visibleOverlays = getVisibleOverlays();
        for (var k in moreOverlays) {
          if (!visibleOverlays[k] && map.hasLayer(moreOverlays[k])) {
            map.removeLayer(moreOverlays[k]);
          }
        }
      }

      // moreBasemapToggle init 已移至 assets/app.js

      // ========== 底图持久化：记住用户上次选择 ==========
      var BASEMAP_STORAGE_KEY = "dupal_basemap";

      // 尝试恢复上次选择的底图，没有则用 ArcGIS-海洋
      var savedBasemap = localStorage.getItem(BASEMAP_STORAGE_KEY);
      if (savedBasemap && allBaseLayers[savedBasemap]) {
        _currentBasemapName = savedBasemap;
      }

      // 暴露给 app.js 中的 toggleConfig
      window.rebuildLayerCtrl = rebuildLayerCtrl;

      // 初始化底图控件（自动根据更多底图开关状态选择子集）
      rebuildLayerCtrl();

      // ========== 覆盖层持久化：记住用户上次选择的覆盖层 ==========
      var OVERLAY_STORAGE_KEY = "dupal_overlays";

      // 合并所有覆盖层到一个查找表
      var allOverlaysLookup = {};
      for (var k in allOverlays) allOverlaysLookup[k] = allOverlays[k];
      for (var k in moreOverlays) allOverlaysLookup[k] = moreOverlays[k];

      // 尝试恢复上次选中的覆盖层
      try {
        var savedOverlays = JSON.parse(
          localStorage.getItem(OVERLAY_STORAGE_KEY),
        );
        if (!Array.isArray(savedOverlays)) savedOverlays = [];
      } catch (e) {
        savedOverlays = [];
      }
      savedOverlays.forEach(function (name) {
        if (allOverlaysLookup[name] && !map.hasLayer(allOverlaysLookup[name])) {
          map.addLayer(allOverlaysLookup[name]);
        }
      });

      // 切换底图时保存选择
      map.on("baselayerchange", function (e) {
        _currentBasemapName = e.name;
        localStorage.setItem(BASEMAP_STORAGE_KEY, e.name);
      });

      // 覆盖层选中/取消时保存选择
      map.on("overlayadd", function (e) {
        try {
          var list =
            JSON.parse(localStorage.getItem(OVERLAY_STORAGE_KEY)) || [];
          if (list.indexOf(e.name) === -1) {
            list.push(e.name);
            localStorage.setItem(OVERLAY_STORAGE_KEY, JSON.stringify(list));
          }
        } catch (ex) {}
      });
      map.on("overlayremove", function (e) {
        try {
          var list =
            JSON.parse(localStorage.getItem(OVERLAY_STORAGE_KEY)) || [];
          var idx = list.indexOf(e.name);
          if (idx !== -1) {
            list.splice(idx, 1);
            localStorage.setItem(OVERLAY_STORAGE_KEY, JSON.stringify(list));
          }
        } catch (ex) {}
      });

      // 监听绘制完成事件，显示测量结果
      map.on("pm:create", function (e) {
        const layer = e.layer;
        let measurement = "";

        if (e.shape === "Line") {
          // 计算线段长度
          const latlngs = layer.getLatLngs();
          let totalDistance = 0;
          for (let i = 0; i < latlngs.length - 1; i++) {
            totalDistance += latlngs[i].distanceTo(latlngs[i + 1]);
          }
          measurement = formatDistance(totalDistance);
        } else if (e.shape === "Polygon" || e.shape === "Rectangle") {
          // 计算面积
          const latlngs = layer.getLatLngs()[0];
          const area = calculatePolygonArea(latlngs);
          measurement = formatArea(area);
        }

        if (measurement) {
          layer.bindPopup(measurement).openPopup();
        }
      });

      // 格式化距离显示
      function formatDistance(meters) {
        if (meters >= 1000) {
          return "距离: " + (meters / 1000).toFixed(2) + " km";
        }
        return "距离: " + meters.toFixed(2) + " m";
      }

      // 格式化面积显示
      function formatArea(sqMeters) {
        if (sqMeters >= 1000000) {
          return "面积: " + (sqMeters / 1000000).toFixed(2) + " km²";
        }
        return "面积: " + sqMeters.toFixed(2) + " m²";
      }

      // 计算多边形面积（使用球面几何）
      function calculatePolygonArea(latlngs) {
        if (latlngs.length < 3) return 0;
        let area = 0;
        const R = 6371000; // 地球半径（米）

        for (let i = 0; i < latlngs.length; i++) {
          const j = (i + 1) % latlngs.length;
          const p1 = latlngs[i];
          const p2 = latlngs[j];

          const lat1 = (p1.lat * Math.PI) / 180;
          const lat2 = (p2.lat * Math.PI) / 180;
          const lng1 = (p1.lng * Math.PI) / 180;
          const lng2 = (p2.lng * Math.PI) / 180;

          area += (lng2 - lng1) * (2 + Math.sin(lat1) + Math.sin(lat2));
        }

        area = (Math.abs(area) * R * R) / 2;
        return area;
      }

      // toggleConfig + initToggle 已移至 assets/app.js
      // 外部文件处理（loadFileAsUserLayer / drag-drop / PWA launch）已移至 assets/geojsonloader.js

    <script>
      // DEM 高程图层交互绑定
      (function () {
        var fileInput = document.getElementById("demFileInput");
        var removeBtn = document.getElementById("demRemoveBtn");
        var opacityRow = document.getElementById("demOpacityRow");
        var opacitySlider = document.getElementById("demOpacitySlider");
        var opacityValue = document.getElementById("demOpacityValue");
        var statusEl = document.getElementById("demStatus");
        var colorModeSelect = document.getElementById("demColorMode");
        var colorModeRow = document.getElementById("demColorModeRow");

        function showControls(show) {
          removeBtn.style.display = show ? "inline-block" : "none";
          opacityRow.style.display = show ? "flex" : "none";
          colorModeRow.style.display = show ? "flex" : "none";
        }

        fileInput.addEventListener("change", function (e) {
          var file = e.target.files[0];
          if (!file) return;
          DemRenderer.loadFromFile(file, map, {
            opacity: 0.8,
            onLoading: function (msg) {
              statusEl.textContent = msg;
              statusEl.style.color = "#666";
            },
            onLoaded: function (georaster) {
              statusEl.textContent = "✓ 已加载（" + file.name + "）";
              statusEl.style.color = "#090";
              showControls(true);
            },
            onError: function (err) {
              statusEl.textContent = "✗ " + err.message;
              statusEl.style.color = "#c00";
              showControls(false);
            },
          });
          fileInput.value = "";
        });

        removeBtn.addEventListener("click", function () {
          DemRenderer.remove();
          statusEl.textContent = "";
          showControls(false);
        });

        opacitySlider.addEventListener("input", function () {
          var val = parseInt(this.value);
          opacityValue.textContent = val + "%";
          DemRenderer.setOpacity(val / 100);
        });

        colorModeSelect.addEventListener("change", function () {
          DemRenderer.setColorMode(this.value);
        });
      })();

    <script src="./assets/pointdrop.js"></script>
    <script>
      // 悬浮窗：popup 打开时插入右下角缩放按钮
      map.on("popupopen", function (e) {
        var popup = e.popup;
        var el = popup.getElement();
        if (!el) return;
        if (el.querySelector(".popup-zoom-btn")) return;

        // 从 popup 关联的图层/要素中提取 bounds 或坐标
        var layer = popup._source || popup._sourceLayer;
        var bounds = null;
        var latLng = null;

        if (layer && typeof layer.getBounds === "function") {
          try {
            var b = layer.getBounds();
            if (b && b.isValid()) bounds = b;
          } catch (ex) {}
        }
        if (!bounds && layer && layer.getLatLng) {
          latLng = layer.getLatLng();
        }
        if (!bounds && !latLng) {
          // 尝试从 popup 自身获取
          var pLatLng = popup.getLatLng ? popup.getLatLng() : null;
          if (pLatLng) latLng = pLatLng;
        }
        if (!bounds && !latLng) return;

        var btn = document.createElement("button");
        btn.className = "popup-zoom-btn";
        btn.title = "缩放至要素";
        btn.innerHTML = "⚲";

        btn.onclick = function (ev) {
          L.DomEvent.stop(ev);
          if (bounds) {
            map.fitBounds(bounds, { maxZoom: 16, padding: [40, 40] });
          } else if (latLng) {
            map.setView([latLng.lat, latLng.lng], Math.max(map.getZoom(), 8));
          }
          map.closePopup();
        };

        el.appendChild(btn);
      });
    </script>
  </body>
</html>
