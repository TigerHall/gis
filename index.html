    <script>
      // 天地图 TK、初始视野等站点级设定统一来自 assets/geo-config.js
      const _MAP_CFG = window.MAP_CONFIG || {};
      const TDT_TK =
        (window.SITE_CONFIG && window.SITE_CONFIG.tiandituToken) || "";
      window.TDT_TK = TDT_TK;

      // L.CRS.EPSG3857.projection.MAX_LATITUDE = 89;

      // 初始化地图容器
      map = L.map("map", {
        maxZoom: _MAP_CFG.maxZoom || 19,
        zoomControl: true,
        attributionControl: false,
      }).setView(_MAP_CFG.center || [32, 107], _MAP_CFG.zoom || 3);

      // ========== 自定义 pane：分层控制底图与覆盖层的叠放顺序 ==========
      // 层级数字全部来自 geo-config.js 的 MAP_CONFIG.panes —— 本文件不含任何具体数值。
      // 铁律：底图（单选）最底，覆盖层（多选）在其之上（见配置里的详细说明）。
      var _PANES = _MAP_CFG.panes || {};
      Object.keys(_PANES).forEach(function (paneName) {
        var z = _PANES[paneName];
        var pane = map.getPane(paneName) || map.createPane(paneName);
        if (pane && z != null) pane.style.zIndex = z;
      });
      // 整幅影像底图不吃鼠标事件（否则会挡住下面要素的点击）
      var _bip = map.getPane("baseImagePane");
      if (_bip) _bip.style.pointerEvents = "none";

    </script>
    <!-- 底图引擎：把 geo-config.js 里的 BASEMAP_CONFIG 变成真实图层，
         并负责图层控件、底图/覆盖层本地记忆、Esri 历史影像时相条、3D 底图映射。
         本文件不含任何图层名与 URL —— 全部来自配置。 -->
    <script src="./assets/basemap-manager.js"></script>
    <script>
      // 监听绘制完成事件，显示测量结果
      map.on("pm:create", function (e) {
        const layer = e.layer;
        let measurement = "";

        if (e.shape === "Line") {
          // 计算线段长度
          const latlngs = layer.getLatLngs();
          let totalDistance = 0;
          for (let i = 0; i < latlngs.length - 1; i++) {
            totalDistance += latlngs[i].distanceTo(latlngs[i + 1]);
          }
          measurement = formatDistance(totalDistance);
        } else if (e.shape === "Polygon" || e.shape === "Rectangle") {
          // 计算面积
          const latlngs = layer.getLatLngs()[0];
          const area = calculatePolygonArea(latlngs);
          measurement = formatArea(area);
        }

        if (measurement) {
          layer.bindPopup(measurement).openPopup();
        }
      });

      // 格式化距离显示
      function formatDistance(meters) {
        if (meters >= 1000) {
          return "距离: " + (meters / 1000).toFixed(2) + " km";
        }
        return "距离: " + meters.toFixed(2) + " m";
      }

      // 格式化面积显示
      function formatArea(sqMeters) {
        if (sqMeters >= 1000000) {
          return "面积: " + (sqMeters / 1000000).toFixed(2) + " km²";
        }
        return "面积: " + sqMeters.toFixed(2) + " m²";
      }

      // 计算多边形面积（使用球面几何）
      function calculatePolygonArea(latlngs) {
        if (latlngs.length < 3) return 0;
        let area = 0;
        const R = 6371000; // 地球半径（米）

        for (let i = 0; i < latlngs.length; i++) {
          const j = (i + 1) % latlngs.length;
          const p1 = latlngs[i];
          const p2 = latlngs[j];

          const lat1 = (p1.lat * Math.PI) / 180;
          const lat2 = (p2.lat * Math.PI) / 180;
          const lng1 = (p1.lng * Math.PI) / 180;
          const lng2 = (p2.lng * Math.PI) / 180;

          area += (lng2 - lng1) * (2 + Math.sin(lat1) + Math.sin(lat2));
        }

        area = (Math.abs(area) * R * R) / 2;
        return area;
      }

      // toggleConfig + initToggle 已移至 assets/app.js

    <script>
      // DEM 高程图层交互绑定
      (function () {
        var fileInput = document.getElementById("demFileInput");
        var removeBtn = document.getElementById("demRemoveBtn");
        var opacityRow = document.getElementById("demOpacityRow");
        var opacitySlider = document.getElementById("demOpacitySlider");
        var opacityValue = document.getElementById("demOpacityValue");
        var statusEl = document.getElementById("demStatus");
        var colorModeSelect = document.getElementById("demColorMode");
        var colorModeRow = document.getElementById("demColorModeRow");

        function showControls(show) {
          removeBtn.style.display = show ? "inline-block" : "none";
          opacityRow.style.display = show ? "flex" : "none";
          colorModeRow.style.display = show ? "flex" : "none";
        }

        fileInput.addEventListener("change", function (e) {
          var file = e.target.files[0];
          if (!file) return;
          DemRenderer.loadFromFile(file, map, {
            opacity: 0.8,
            onLoading: function (msg) {
              statusEl.textContent = msg;
              statusEl.style.color = "#666";
            },
            onLoaded: function (georaster) {
              statusEl.textContent = "✓ 已加载（" + file.name + "）";
              statusEl.style.color = "#090";
              showControls(true);
            },
            onError: function (err) {
              statusEl.textContent = "✗ " + err.message;
              statusEl.style.color = "#c00";
              showControls(false);
            },
          });
          fileInput.value = "";
        });

        removeBtn.addEventListener("click", function () {
          DemRenderer.remove();
          statusEl.textContent = "";
          showControls(false);
        });

        opacitySlider.addEventListener("input", function () {
          var val = parseInt(this.value);
          opacityValue.textContent = val + "%";
          DemRenderer.setOpacity(val / 100);
        });

        colorModeSelect.addEventListener("change", function () {
          DemRenderer.setColorMode(this.value);
        });
      })();
    </script>

    <script>
      // 悬浮窗：popup 打开时在内容底部（图层名下方）添加缩放和详情按钮
      map.on("popupopen", function (e) {
        var popup = e.popup;
        var container = popup._container;
        if (!container) return;
        if (container.querySelector(".popup-ext-btn-wrap")) return;

        // 从 popup 关联的图层/要素中提取 bounds 或坐标
        var layer = popup._source || popup._sourceLayer;
        var bounds = null;
        var latLng = null;

        if (layer && typeof layer.getBounds === "function") {
          try {
            var b = layer.getBounds();
            if (b && b.isValid()) bounds = b;
          } catch (ex) {}
        }
        if (!bounds && layer && layer.getLatLng) {
          latLng = layer.getLatLng();
        }
        if (!bounds && !latLng) {
          // 尝试从 popup 自身获取
          var pLatLng = popup.getLatLng ? popup.getLatLng() : null;
          if (pLatLng) latLng = pLatLng;
        }
        if (!bounds && !latLng) return;

        // 创建横向按钮组容器（放在内容下方，与 3D 悬浮窗一致）
        var wrap = document.createElement("div");
        wrap.className = "popup-ext-btn-wrap";

        // 缩放按钮
        var zoomBtn = document.createElement("button");
        zoomBtn.className = "popup-ext-btn";
        zoomBtn.title = "缩放至要素";
        zoomBtn.innerHTML = "⚲ 缩放至";
        zoomBtn.onclick = function (ev) {
          L.DomEvent.stop(ev);
          if (bounds) {
            map.fitBounds(bounds, { maxZoom: 16, padding: [40, 40] });
          } else if (latLng) {
            map.setView([latLng.lat, latLng.lng], Math.max(map.getZoom(), 8));
          }
          map.closePopup();
        };

        // 详情按钮
        var detailBtn = document.createElement("button");
        detailBtn.className = "popup-ext-btn";
        detailBtn.title = "查看属性与图表";
        detailBtn.innerHTML = "📋 详情";
        detailBtn.onclick = function (ev) {
          L.DomEvent.stop(ev);
          var feature = null;
          var layerId = null;
          var layerName = "";

          // Canvas 要素：直接从 popup 上的自定义属性读取
          if (popup._featureRef) {
            feature = popup._featureRef;
            layerId = popup._layerId || null;
            layerName = popup._layerName || "";
          }

          // 非 Canvas：从 popup._source 获取 feature
          if (!feature) {
            var source = popup._source || popup._sourceLayer;
            if (source && source.feature) {
              feature = source.feature;
            }
          }

          // 尝试匹配 layerId
          if (!layerId && feature) {
            if (feature._fileName && window._layerIdByFileName) {
              layerId = window._layerIdByFileName[feature._fileName];
            }
            if (!layerId && window._featureCache) {
              for (var cacheId in window._featureCache) {
                var feats = window._featureCache[cacheId];
                if (feats) {
                  for (var fi = 0; fi < feats.length; fi++) {
                    if (feats[fi] === feature) {
                      layerId = cacheId;
                      break;
                    }
                  }
                }
                if (layerId) break;
              }
            }
          }

          // 获取图层名
          if (layerId) {
            var cbEl = document.getElementById(layerId);
            if (cbEl) layerName = cbEl.dataset.layerName || "";
          }

          // 如果没有 layerId 但有 popup 的 latlng，构造精简 feature
          if (!feature) {
            var pLL = popup.getLatLng ? popup.getLatLng() : null;
            feature = {
              type: "Feature",
              geometry: pLL
                ? { type: "Point", coordinates: [pLL.lng, pLL.lat] }
                : null,
              properties: {},
            };
          }

          if (
            typeof window.FeaturePanel !== "undefined" &&
            window.FeaturePanel.openSingle
          ) {
            window.FeaturePanel.openSingle(feature, layerId, layerName);
            map.closePopup();
          }
        };

        wrap.appendChild(zoomBtn);
        wrap.appendChild(detailBtn);
        // 插入到 popup 内容区内部（.leaflet-popup-content），即图层名（footer）下方
        var contentEl = container.querySelector(".leaflet-popup-content");
        (contentEl || container).appendChild(wrap);
      });
    </script>

    <!-- 要素详情面板（属性表 + 图表） -->
    <div class="feature-panel-backdrop" id="featurePanelBackdrop"></div>
    <div class="feature-panel" id="featureDetailPanel">
      <!-- 左侧拖拽 resize 手柄 -->
      <div
        class="feature-panel-resize-handle"
        id="featurePanelResizeHandle"
      ></div>
      <!-- 头部 -->
      <div class="feature-panel-header">
        <div>
          <div class="feature-panel-title" id="featurePanelTitle">要素详情</div>
          <div class="feature-panel-subtitle" id="featurePanelSubtitle"></div>
        </div>
        <button class="feature-panel-close" id="featurePanelClose" title="关闭">
          ✕
        </button>
      </div>
      <!-- Tab 导航 -->
      <div class="feature-panel-tabs">
        <button class="feature-panel-tab active" id="featurePanelTabAttr">
          📋 属性表
        </button>
        <button class="feature-panel-tab" id="featurePanelTabChart">
          📊 图表
        </button>
      </div>
      <!-- 内容区 -->
      <div class="feature-panel-content">
        <!-- 属性表 Tab -->
        <div
          id="featurePanelContentAttr"
          style="
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
          "
        >
          <!-- 模式切换 -->
          <div
            class="feature-panel-mode-switch"
            id="featurePanelModeSwitch"
            style="display: none"
          >
            <span class="mode-label">显示：</span>
            <button class="mode-btn active" id="featurePanelModeSingle">
              当前要素
            </button>
            <button class="mode-btn" id="featurePanelModeLayer">
              全部要素
            </button>
          </div>
          <!-- 搜索 -->
          <div class="feature-panel-search">
            <input
              type="text"
              id="featurePanelSearchInput"
              placeholder="搜索属性..."
              autocomplete="off"
            />
            <span
              class="feature-panel-result-count"
              id="featurePanelResultCount"
            ></span>
          </div>
          <!-- 表格 -->
          <div class="feature-panel-table-wrap" id="featurePanelTableWrap">
            <table class="feature-panel-table" id="featurePanelTable"></table>
          </div>
          <!-- 空状态 -->
          <div
            class="feature-panel-empty"
            id="featurePanelEmptyAttr"
            style="display: none"
          >
            <span style="font-size: 32px">📋</span>
            <span class="empty-text">暂无数据</span>
          </div>
          <!-- 翻页器 -->
          <div class="feature-panel-pager" id="featurePanelPager">
            <button class="pager-prev">◀ 上一页</button>
            <span class="page-info" id="featurePanelPageInfo"
              >第 1 页 / 共 1 页</span
            >
            <button class="pager-next">下一页 ▶</button>
            <div class="page-jump">
              <span>跳至</span>
              <input
                type="number"
                id="featurePanelPageInput"
                min="1"
                value="1"
              />
              <span>页</span>
            </div>
          </div>
        </div>
        <!-- 图表 Tab -->
        <div
          id="featurePanelContentChart"
          style="
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
          "
        >
          <div class="feature-panel-chart-toolbar">
            <label for="featurePanelChartType">图表类型：</label>
            <select id="featurePanelChartType">
              <option value="bar" selected>柱状图</option>
              <option value="scatter">散点图</option>
              <option value="histogram">直方图</option>
              <option value="pie">饼图</option>
              <option value="radar">雷达图</option>
            </select>
            <label for="featurePanelChartX" class="chart-field-label"
              >X 轴：</label
            >
            <select id="featurePanelChartX" class="chart-field-select"></select>
            <label
              for="featurePanelChartY"
              class="chart-field-label chart-field-y-label"
              >Y 轴：</label
            >
            <select id="featurePanelChartY" class="chart-field-select"></select>
            <label
              for="featurePanelChartGroup"
              class="chart-field-label chart-field-group-label"
              >分组：</label
            >
            <select
              id="featurePanelChartGroup"
              class="chart-field-select"
            ></select>
            <label class="chart-check-label">
              <input type="checkbox" id="featurePanelChartShowLegend" checked />
              图例
            </label>
          </div>
          <div
            class="feature-panel-chart-container"
            id="featurePanelChartContainer"
          ></div>
          <div
            class="feature-panel-empty"
            id="featurePanelEmptyChart"
            style="display: none"
          >
            <span style="font-size: 32px">📊</span>
            <span class="empty-text">没有数值字段可展示</span>
          </div>
          <div
            class="feature-panel-chart-legend"
            id="featurePanelChartLegend"
          ></div>
        </div>
      </div>
    </div>
  </body>
</html>
