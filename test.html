<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>GeoJSON 原始渲染测试</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='1em' font-size='80'>🌏</text></svg>"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <link rel="stylesheet" href="./assets/dialog.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100dvh;
        font-family: sans-serif;
        padding: max(0px, env(safe-area-inset-top))
          max(0px, env(safe-area-inset-right))
          max(0px, env(safe-area-inset-bottom))
          max(0px, env(safe-area-inset-left));
      }
      #map {
        height: 100dvh;
        width: 100%;
      }
      /* 备案号悬浮条（固定右下角，合规要求） */
      #beianBar {
        position: fixed;
        bottom: 6px;
        right: 8px;
        z-index: 1100;
        font-size: 11px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        pointer-events: auto;
        user-select: none;
      }
      #beianBar a {
        color: inherit;
        text-decoration: none;
      }
      #beianBar a:hover {
        text-decoration: underline;
        color: #fff;
      }
      .fab {
        position: fixed;
        bottom: 60px;
        right: 16px;
        z-index: 2000;
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: none;
        color: #fff;
        font-size: 20px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .fab:hover {
        transform: scale(1.08);
      }
      .fab:active {
        transform: scale(0.95);
      }
      #changelogBtn {
        background: #1890ff;
        box-shadow: 0 2px 12px rgba(24, 144, 255, 0.4);
      }
      #changelogBtn:hover {
        box-shadow: 0 4px 16px rgba(24, 144, 255, 0.6);
      }
      #toastDemoBtn {
        background: #52c41a;
        box-shadow: 0 2px 12px rgba(82, 196, 26, 0.4);
        bottom: 120px;
      }
      #toastDemoBtn:hover {
        box-shadow: 0 4px 16px rgba(82, 196, 26, 0.6);
      }
      #posDemoBtn {
        background: #722ed1;
        box-shadow: 0 2px 12px rgba(114, 46, 209, 0.4);
        bottom: 180px;
      }
      #posDemoBtn:hover {
        box-shadow: 0 4px 16px rgba(114, 46, 209, 0.6);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <!-- 悬浮按钮组 -->
    <button id="toastDemoBtn" class="fab" title="模拟导出流程">🔄</button>
    <button id="posDemoBtn" class="fab" title="测试右下角弹窗">📍</button>
    <button id="changelogBtn" class="fab" title="更新记录">📋</button>

    <!-- 静态 Toast（SW 更新场景用） -->
    <dialog id="updateToast" class="toast-dialog">
      <div class="toast-cnt">
        <span class="toast-msg">📦 新版本可用</span>
        <button class="toast-action">刷新</button>
      </div>
    </dialog>

    <!-- 备案号（合规要求：底部可见，链接跳转工信部、公安） -->
    <div id="beianBar">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"
        >蜀ICP备2025119436号</a
      >
      &nbsp;
      <a
        href="https://beian.mps.gov.cn/#/query/webSearch?code=33030402001567"
        rel="noreferrer"
        target="_blank"
        ><img
          src="./assets/images/备案编号图标.png"
          style="vertical-align: -2px; height: 1em; margin-right: 3px"
        />浙公网安备33030402001567号</a
      >
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="./assets/Leaflet.VectorGrid.bundled.min.js"></script>
    <script src="./assets/marked.min.js"></script>
    <script src="./assets/dialog.js"></script>
    <script>
      var map = L.map("map", {
        maxZoom: 19,
        zoomControl: true,
        attributionControl: false,
        maxBoundsViscosity: 1.0,
      }).setView([32, 107], 3);

      var imagery = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 18, attribution: "&copy; Esri", noWrap: false },
      ).addTo(map);

      var layerDefs = [
        { name: "全球16大板块 plate16", file: "plate16" },
        { name: "大陆板块 plate_cont", file: "plate_cont" },
        { name: "大洋板块 plate_ocean", file: "plate_ocean" },
        { name: "1全球洋壳 GlobalOceanicCrust", file: "1GlobalOceanicCrust" },
        { name: "3次大洋域 SubOceanDomain", file: "3SubOceanDomain" },
        { name: "4洋中脊作用域 RidgeDomain", file: "4RidgeDomain" },
        { name: "0作用域边界 RDboundary", file: "RD_plgn1_5" },
      ];

      var overlayLayers = {};

      layerDefs.forEach(function (def) {
        var vectorLayer = null;

        var g = L.layerGroup();
        g._done = false;
        g.on("add", function () {
          if (g._done) {
            // 已创建过 vectorLayer，直接加回地图
            if (vectorLayer) map.addLayer(vectorLayer);
            return;
          }
          g._done = true;
          fetch("./assets/geojson/" + def.file + ".json.gz")
            .then(function (r) {
              return r.blob().then(function (b) {
                return new Response(
                  b.stream().pipeThrough(new DecompressionStream("gzip")),
                ).json();
              });
            })
            .then(function (data) {
              vectorLayer = L.vectorGrid.slicer(data, {
                rendererFactory: function (tileCoord, tileSize, opts) {
                  var r = L.svg.tile(tileCoord, tileSize, opts);
                  r._drawing = true; // 否则 _updatePoly 因为 _drawing 为 falsy 而跳过
                  return r;
                },
                vectorTileLayerStyles: {
                  sliced: function (props, zoom) {
                    var id = props.FID || props.OBJECTID || 0;
                    var h = (id * 137.508) % 360; // 黄金角均匀散色
                    return {
                      color: "#000",
                      weight: 0.5,
                      opacity: 1,
                      fillColor: "hsl(" + h + ",70%,50%)",
                      fillOpacity: 0.5,
                      fill: true,
                      stroke: true,
                    };
                  },
                },
                interactive: true,
              });

              vectorLayer
                .on("mouseover", function (e) {
                  var p = e.layer && e.layer.properties;
                  if (!p) return;
                  var name =
                    p.plate ||
                    p.Plate ||
                    p.PLATE ||
                    p.Name ||
                    p.name ||
                    p.NAME ||
                    p.title ||
                    p.Title ||
                    p.label ||
                    p.Label ||
                    p.name_en ||
                    p.Name_En ||
                    p.NAME_EN ||
                    p.namezh ||
                    p.name_zh ||
                    p.NameZh ||
                    "";
                  if (name) {
                    L.popup().setContent(name).setLatLng(e.latlng).openOn(map);
                  }
                })
                .on("mouseout", function () {
                  map.closePopup();
                })
                .addTo(map);
            })
            .catch(function (e) {
              console.error(def.name, e);
            });
        });

        // remove 时仅从地图移除，不销毁实例（供重新勾选时复用）
        g.on("remove", function () {
          if (vectorLayer) map.removeLayer(vectorLayer);
        });

        overlayLayers[def.name] = g;
      });

      L.control.layers({ "ArcGIS 影像": imagery }, overlayLayers).addTo(map);
    </script>

    <!-- dialog.js 演示 -->
    <script>
      // ----- 模态弹窗：更新记录 -----
      document
        .getElementById("changelogBtn")
        .addEventListener("click", function () {
          showMarkdown("docs/CHANGELOG.md", "📝 更新记录");
        });

      // ----- Toast：模拟导出流程（5s后自动完成） -----
      document
        .getElementById("toastDemoBtn")
        .addEventListener("click", function () {
          var t = showToast("⏳ 正在导出数据，图层复杂时可能较慢，请勿操作…", {
            duration: 0,
          });
          setTimeout(function () {
            closeToast(t);
            showToast("✅ 导出成功", { duration: 3000 });
          }, 5000);
        });

      // ----- Toast：测试右下角弹窗 -----
      document
        .getElementById("posDemoBtn")
        .addEventListener("click", function () {
          showToast("📌 右下角通知 — 内容自适应宽度测试", {
            position: "bottom-right",
            duration: 4000,
          });
        });

      // ----- 静态 toast（SW 更新场景） -----
      var toastDialog = document.getElementById("updateToast");
      toastDialog.addEventListener("click", function (e) {
        if (e.target === toastDialog) toastDialog.close();
      });
      window._showUpdateToast = function () {
        if (!toastDialog.open) toastDialog.show();
      };
    </script>
  </body>
</html>
