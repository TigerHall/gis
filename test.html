<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>GeoJSON 原始渲染测试</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='1em' font-size='80'>🌏</text></svg>"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100dvh;
        font-family: sans-serif;
        padding: max(0px, env(safe-area-inset-top))
          max(0px, env(safe-area-inset-right))
          max(0px, env(safe-area-inset-bottom))
          max(0px, env(safe-area-inset-left));
      }
      #map {
        height: 100dvh;
        width: 100%;
      }
      /* 备案号悬浮条（固定右下角，合规要求） */
      #beianBar {
        position: fixed;
        bottom: 6px;
        right: 8px;
        z-index: 1100;
        font-size: 11px;
        line-height: 1.4;
        color: rgba(255, 255, 255, 0.75);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        pointer-events: auto;
        user-select: none;
      }
      #beianBar a {
        color: inherit;
        text-decoration: none;
      }
      #beianBar a:hover {
        text-decoration: underline;
        color: #fff;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <!-- 备案号（合规要求：底部可见，链接跳转工信部、公安） -->
    <div id="beianBar">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener"
        >蜀ICP备2025119436号</a
      >
      &nbsp;
      <a
        href="https://beian.mps.gov.cn/#/query/webSearch?code=33030402001567"
        rel="noreferrer"
        target="_blank"
        ><img
          src="./assets/images/备案编号图标.png"
          style="vertical-align: -2px; height: 1em; margin-right: 3px"
        />浙公网安备33030402001567号</a
      >
    </div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script src="./assets/Leaflet.VectorGrid.bundled.min.js"></script>
    <script>
      var map = L.map("map", {
        maxZoom: 19,
        zoomControl: true,
        attributionControl: false,
        maxBoundsViscosity: 1.0,
      }).setView([32, 107], 3);

      var imagery = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 18, attribution: "&copy; Esri", noWrap: false },
      ).addTo(map);

      var layerDefs = [
        { name: "全球16大板块 plate16", file: "plate16" },
        { name: "大陆板块 plate_cont", file: "plate_cont" },
        { name: "大洋板块 plate_ocean", file: "plate_ocean" },
        { name: "1全球洋壳 GlobalOceanicCrust", file: "1GlobalOceanicCrust" },
        { name: "3次大洋域 SubOceanDomain", file: "3SubOceanDomain" },
        { name: "4洋中脊作用域 RidgeDomain", file: "4RidgeDomain" },
        { name: "0作用域边界 RDboundary", file: "RD_plgn1_5" },
      ];

      var overlayLayers = {};

      layerDefs.forEach(function (def) {
        var vectorLayer = null;

        var g = L.layerGroup();
        g._done = false;
        g.on("add", function () {
          if (g._done) {
            // 已创建过 vectorLayer，直接加回地图
            if (vectorLayer) map.addLayer(vectorLayer);
            return;
          }
          g._done = true;
          fetch("./assets/geojson/" + def.file + ".json.gz")
            .then(function (r) {
              return r.blob().then(function (b) {
                return new Response(
                  b.stream().pipeThrough(new DecompressionStream("gzip")),
                ).json();
              });
            })
            .then(function (data) {
              vectorLayer = L.vectorGrid.slicer(data, {
                rendererFactory: function (tileCoord, tileSize, opts) {
                  var r = L.svg.tile(tileCoord, tileSize, opts);
                  r._drawing = true; // 否则 _updatePoly 因为 _drawing 为 falsy 而跳过
                  return r;
                },
                vectorTileLayerStyles: {
                  sliced: function (props, zoom) {
                    var id = props.FID || props.OBJECTID || 0;
                    var h = (id * 137.508) % 360; // 黄金角均匀散色
                    return {
                      color: "#000",
                      weight: 0.5,
                      opacity: 1,
                      fillColor: "hsl(" + h + ",70%,50%)",
                      fillOpacity: 0.5,
                      fill: true,
                      stroke: true,
                    };
                  },
                },
                interactive: true,
              });

              vectorLayer
                .on("mouseover", function (e) {
                  var p = e.layer && e.layer.properties;
                  if (!p) return;
                  var name =
                    p.plate ||
                    p.Plate ||
                    p.PLATE ||
                    p.Name ||
                    p.name ||
                    p.NAME ||
                    p.title ||
                    p.Title ||
                    p.label ||
                    p.Label ||
                    p.name_en ||
                    p.Name_En ||
                    p.NAME_EN ||
                    p.namezh ||
                    p.name_zh ||
                    p.NameZh ||
                    "";
                  if (name) {
                    L.popup().setContent(name).setLatLng(e.latlng).openOn(map);
                  }
                })
                .on("mouseout", function () {
                  map.closePopup();
                })
                .addTo(map);
            })
            .catch(function (e) {
              console.error(def.name, e);
            });
        });

        // remove 时仅从地图移除，不销毁实例（供重新勾选时复用）
        g.on("remove", function () {
          if (vectorLayer) map.removeLayer(vectorLayer);
        });

        overlayLayers[def.name] = g;
      });

      L.control.layers({ "ArcGIS 影像": imagery }, overlayLayers).addTo(map);
    </script>
  </body>
</html>
