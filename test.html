<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>GeoJSON 原始渲染测试</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='1em' font-size='80'>🌏</text></svg>"
    />
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100dvh;
        font-family: sans-serif;
        padding: max(0px, env(safe-area-inset-top))
          max(0px, env(safe-area-inset-right))
          max(0px, env(safe-area-inset-bottom))
          max(0px, env(safe-area-inset-left));
      }
      #map {
        height: 100dvh;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
      var map = L.map("map").setView([20, 0], 2);

      var imagery = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        { maxZoom: 18, attribution: "&copy; Esri", noWrap: false },
      ).addTo(map);

      var layerDefs = [
        { name: "全球16大板块 plate16", file: "plate16" },
        { name: "大陆板块 plate_cont", file: "plate_cont" },
        { name: "大洋板块 plate_ocean", file: "plate_ocean" },
        { name: "1全球洋壳 GlobalOceanicCrust", file: "1GlobalOceanicCrust" },
        { name: "3次大洋域 SubOceanDomain", file: "3SubOceanDomain" },
        { name: "4洋中脊作用域 RidgeDomain", file: "4RidgeDomain" },
        { name: "0作用域边界 RDboundary", file: "RD_plgn1_5" },
      ];

      var overlayLayers = {};

      layerDefs.forEach(function (def) {
        var g = L.layerGroup();
        g._done = false;
        g.on("add", function () {
          if (g._done) return;
          g._done = true;
          fetch("./assets/geojson/" + def.file + ".json.gz")
            .then(function (r) {
              return r.blob().then(function (b) {
                return new Response(
                  b.stream().pipeThrough(new DecompressionStream("gzip")),
                ).json();
              });
            })
            .then(function (data) {
              [0, 360, -360].forEach(function (offset) {
                g.addLayer(
                  L.geoJSON(shiftLng(data, offset), {
                    style: randomStyle,
                    onEachFeature: function (f, l) {
                      var n = f.properties && f.properties.Name;
                      if (n) l.bindTooltip(n, { sticky: true });
                    },
                  }),
                );
              });
            })
            .catch(function (e) {
              console.error(def.name, e);
            });
        });
        overlayLayers[def.name] = g;
      });

      L.control.layers({ "ArcGIS 影像": imagery }, overlayLayers).addTo(map);

      function randomStyle() {
        var h = Math.floor(Math.random() * 360);
        return {
          color: "hsl(" + h + ",60%,50%)",
          weight: 1,
          opacity: 0.8,
          fillColor: "hsl(" + h + ",60%,50%)",
          fillOpacity: 0.4,
        };
      }

      // 深拷贝 GeoJSON 并偏移所有经度
      function shiftLng(geojson, offset) {
        var copy = JSON.parse(JSON.stringify(geojson));
        function walk(c) {
          if (!c) return;
          if (Array.isArray(c[0])) {
            for (var i = 0; i < c.length; i++) walk(c[i]);
          } else c[0] += offset;
        }
        if (copy.features)
          copy.features.forEach(function (f) {
            walk(f.geometry && f.geometry.coordinates);
          });
        return copy;
      }
    </script>
  </body>
</html>
